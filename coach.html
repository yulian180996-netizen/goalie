      mClose(); MC.list = null; MC.sel = c.n; OF.mc = c.n; mcLoad(true);
    });
  };
}

/* ───────── игры ───────── */
var GM = { list: null, sit: [], sk: [], gk: '' };
var LOADS = [['H','тяжёлая'], ['S','солидная'], ['O','нормальная'], ['B','плохая']];
var RESS  = ['В', 'ВО', 'ВБ', 'П', 'ПО', 'ПБ'];

function gmLoad(fresh){
  var sec = $('main').querySelector('[data-pg="games"]');
  if (GM.list && !fresh){ gmDraw(); return; }
  sec.innerHTML = '<div class="head"><h1>Игры</h1></div><div class="card"><div class="muted">Загружаю…</div></div>';
  api({ a:'games2' }, function(res){
    if (!res || !res.ok){
      sec.innerHTML = '<div class="head"><h1>Игры</h1></div>' +
        '<div class="card"><div class="muted">Не удалось загрузить.</div></div>';
      return;
    }
    GM.list = res.list || [];
    GM.sit  = res.sit  || [];
    GM.sk   = res.sk   || [];
    gmDraw();
  });
}

function gmDraw(){
  var sec = $('main').querySelector('[data-pg="games"]');
  var list = GM.gk ? GM.list.filter(function(g){ return g.gk === GM.gk; }) : GM.list;

  /* сводка по отфильтрованному */
  var n = list.length, sh = 0, ga = 0, w = 0, l = 0, psy = 0, psyN = 0, gmp = 0, gmm = 0;
  list.forEach(function(g){
    sh += g.sh; ga += g.ga; gmp += g.gmp; gmm += g.gmm;
    if (/^В/.test(g.res)) w++; else if (/^П/.test(g.res)) l++;
    if (g.psy){ psy += g.psy; psyN++; }
  });
  var pct = sh ? Math.round((sh - ga) / sh * 1000) / 10 : null;
  var gmPct = (gmp + gmm) ? Math.round(gmp / (gmp + gmm) * 1000) / 10 : null;

  var names = {};
  GM.list.forEach(function(g){ if (g.gk) names[g.gk] = 1; });
  var opts = '<option value="">Все вратари</option>' + Object.keys(names).sort().map(function(x){
    return '<option' + (x === GM.gk ? ' selected' : '') + '>' + esc(x) + '</option>';
  }).join('');

  var rows = list.map(function(g){
    return '<tr data-gid="' + esc(g.id) + '">' +
      '<td>' + esc(g.d.slice(8) + '.' + g.d.slice(5,7)) + '</td>' +
      '<td class="gk">' + esc(g.gk) + '</td>' +
      '<td>' + esc(g.opp) + '<div class="muted" style="font-size:11.5px">' +
        (g.home ? 'дома' : 'выезд') + '</div></td>' +
      '<td>' + (g.res ? '<span class="wl ' + (/^В/.test(g.res) ? 'w' : 'l') + '">' + esc(g.res) + '</span>' : '') + '</td>' +
      '<td class="num">' + g.sh + '</td>' +
      '<td class="num">' + g.ga + '</td>' +
      '<td class="num"><b>' + (g.pct === null ? '—' : g.pct + '%') + '</b></td>' +
      '<td class="num">' + (g.gmp || g.gmm ? g.gmp + '/' + (g.gmp + g.gmm) : '—') + '</td>' +
      '<td>' + (g.load ? '<span class="ld ' + esc(g.load) + '">' + esc(g.load) + '</span>' : '') + '</td>' +
      '<td class="num">' + (g.psy || '—') + '</td>' +
      '<td class="num">' + ((g.gls || []).length || '') + '</td>' +
      '</tr>';
  }).join('');

  sec.innerHTML =
    '<div class="head"><h1>Игры</h1>' +
    '<div class="sub">отчёт, статистика, психология и голы</div>' +
    '<div class="sp"></div>' +
    '<select id="gm-gk" style="height:38px;border:1px solid var(--line);border-radius:10px;' +
      'background:var(--bg2);color:var(--tx);font-family:inherit;font-size:13.5px;padding:0 10px">' + opts + '</select>' +
    '<button class="btn sec sm" id="gm-new" style="margin-left:8px">+ Добавить игру</button></div>' +

    '<div class="kpi">' +
      '<div class="kp"><b>' + n + '</b><i>игр' + (GM.gk ? ' · ' + esc(GM.gk) : '') + '</i></div>' +
      '<div class="kp"><b>' + w + ' : ' + l + '</b><i>победы и поражения</i></div>' +
      '<div class="kp"><b>' + (pct === null ? '—' : pct + '%') + '</b><i>отражено, ' + (sh - ga) + ' из ' + sh + '</i></div>' +
      '<div class="kp"><b>' + (gmPct === null ? '—' : gmPct + '%') + '</b><i>голевые моменты</i></div>' +
      '<div class="kp"><b>' + (psyN ? Math.round(psy / psyN * 10) / 10 : '—') + '</b><i>психология, средний балл</i></div>' +
    '</div>' +

    '<div class="card"><h2>Журнал игр</h2>' + (n
      ? '<table class="tbl"><thead><tr>' +
          '<th>Дата</th><th>Вратарь</th><th>Соперник</th><th>Рез.</th>' +
          '<th class="num">БВ</th><th class="num">ПШ</th><th class="num">Отр.</th>' +
          '<th class="num">ГМ</th><th>Нагр.</th><th class="num">Псих.</th><th class="num">Голы</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>'
      : '<div class="soon"><b>Игр пока нет</b>Нажми «Добавить игру», чтобы занести первый матч.</div>') +
    '</div>';

  $('gm-gk').onchange = function(){ GM.gk = this.value; gmDraw(); };
  $('gm-new').onclick = function(){ gmEdit(''); };
  var tb = sec.querySelector('tbody');
  if (tb) tb.onclick = function(e){
    var tr = e.target.closest ? e.target.closest('[data-gid]') : null;
    if (tr) gmEdit(tr.getAttribute('data-gid'));
  };
}

/* ── карточка игры ── */
var GME = null;

function gmEdit(id){
  GME = null;
  (GM.list || []).forEach(function(g){ if (g.id === id) GME = JSON.parse(JSON.stringify(g)); });
  if (!GME) GME = { id:'', d: TODAY, gk:'', uid:'', opp:'', home:1, res:'',
                    sh:0, ga:0, gmp:0, gmm:0, load:'', psy:0, cm:'', gls:[], sk:{} };
  gmForm();
}

function gmForm(){
  var g = GME;
  var gkOpts = ROSTER.map(function(r){
    var nm = r.name || '';
    return '<option value="' + esc(nm) + '" data-uid="' + esc(r.uid) + '"' +
           (nm === g.gk ? ' selected' : '') + '>' + esc(nm) + '</option>';
  }).join('');
  if (g.gk && ROSTER.every(function(r){ return r.name !== g.gk; }))
    gkOpts = '<option selected>' + esc(g.gk) + '</option>' + gkOpts;

  var glRows = (g.gls || []).map(function(x, i){
    return '<div class="gl" data-gl="' + i + '">' +
      '<select data-gf="s">' + GM.sit.map(function(sit){
        return '<option' + (sit === x.s ? ' selected' : '') + '>' + esc(sit) + '</option>';
      }).join('') + '</select>' +
      '<input data-gf="d" placeholder="деталь" value="' + esc(x.d || '') + '">' +
      '<select class="z" data-gf="z">' +
        '<option value=""></option>' +
        [1,2,3,4,5,6,7,8,9].map(function(z){
          return '<option value="' + z + '"' + (Number(x.z) === z ? ' selected' : '') + '>' + z + '</option>';
        }).join('') + '</select>' +
      '<button class="x" data-glx="' + i + '">×</button></div>';
  }).join('');

  mOpen(
    '<h2>' + (g.id ? 'Игра' : 'Новая игра') + '</h2>' +
    '<div class="ms">Отражённые броски и процент считаются сами.</div>' +

    '<div class="row2">' +
      '<div class="fld"><label>Дата</label><input id="f-d" type="date" value="' + esc(g.d) + '"></div>' +
      '<div class="fld"><label>Вратарь</label><select id="f-gk">' + gkOpts + '</select></div>' +
    '</div>' +
    '<div class="row2">' +
      '<div class="fld"><label>Соперник</label><input id="f-opp" value="' + esc(g.opp) + '"></div>' +
      '<div class="fld"><label>Где</label><select id="f-home">' +
        '<option value="1"' + (g.home ? ' selected' : '') + '>Дома</option>' +
        '<option value="0"' + (g.home ? '' : ' selected') + '>Выезд</option></select></div>' +
    '</div>' +
    '<div class="row2">' +
      '<div class="fld"><label>Результат</label><select id="f-res">' +
        '<option value=""></option>' + RESS.map(function(r){
          return '<option' + (r === g.res ? ' selected' : '') + '>' + r + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="fld"><label>Нагрузка и качество</label><select id="f-load">' +
        '<option value=""></option>' + LOADS.map(function(x){
          return '<option value="' + x[0] + '"' + (x[0] === g.load ? ' selected' : '') + '>' +
                 x[0] + ' — ' + x[1] + '</option>'; }).join('') +
      '</select></div>' +
    '</div>' +
    '<div class="row2">' +
      '<div class="fld"><label>Броски в створ</label><input id="f-sh" type="number" min="0" value="' + g.sh + '"></div>' +
      '<div class="fld"><label>Пропущено</label><input id="f-ga" type="number" min="0" value="' + g.ga + '"></div>' +
    '</div>' +
    '<div class="row2">' +
      '<div class="fld"><label>Голевых выручил</label><input id="f-gmp" type="number" min="0" value="' + g.gmp + '"></div>' +
      '<div class="fld"><label>Голевых пропустил</label><input id="f-gmm" type="number" min="0" value="' + g.gmm + '"></div>' +
    '</div>' +
    '<div class="fld"><label>Психология, балл 1–10 · 9–10 ключевая роль · 7–8 уверенно · 5–6 качели · 3–4 срыв</label>' +
      '<input id="f-psy" type="number" min="0" max="10" value="' + (g.psy || '') + '"></div>' +
    '<div class="fld"><label>Комментарий</label><textarea id="f-cm">' + esc(g.cm) + '</textarea></div>' +

    '<div class="fld"><label>Навыки — сколько раз и из них удачно</label>' +
      '<div class="dets" style="margin:-2px 0 8px">пустая строка — навык в игре не встречался</div>' +
      '<table class="sktb"><thead><tr><th>Навык</th><th class="num">Всего</th>' +
      '<th class="num">Удачно</th><th class="num">Ошибка</th><th class="num">%</th></tr></thead><tbody>' +
      (GM.sk || []).map(function(nm){
        var x = (g.sk || {})[nm] || {};
        var pc = x.n ? Math.round((x.ok || 0) / x.n * 100) + '%' : '—';
        return '<tr data-sk="' + esc(nm) + '"><td>' + esc(nm) + '</td>' +
          '<td class="num"><input data-sf="n" type="number" min="0" value="' + (x.n || '') + '"></td>' +
          '<td class="num"><input data-sf="ok" type="number" min="0" value="' + (x.ok || '') + '"></td>' +
          '<td class="num"><input data-sf="e" type="number" min="0" value="' + (x.e || '') + '"></td>' +
          '<td class="num pc">' + pc + '</td></tr>';
      }).join('') + '</tbody></table></div>' +

    '<div class="fld"><label>Голы — ситуация, деталь, зона ворот</label>' +
      '<div class="dets" style="margin:-2px 0 8px">зоны: 1 2 3 — верх, 4 5 6 — середина, 7 8 9 — низ; слева направо со стороны броска</div>' + glRows +
      '<button class="addbtn" id="gl-add">+ добавить гол</button></div>' +

    '<div class="mact">' +
      '<button class="btn" id="gm-save">Сохранить</button>' +
      '<button class="btn sec" id="gm-cancel">Отмена</button>' +
      '<div class="sp"></div>' +
      (g.id ? '<button class="del" id="gm-del">Удалить игру</button>' : '') +
    '</div>');

  $('gm-cancel').onclick = mClose;
  $('gl-add').onclick = function(){ gmSync(); GME.gls.push({ s: GM.sit[0], d:'', z:'' }); gmForm(); };
  $('mbody').onclick = function(e){
    var b = e.target.closest ? e.target.closest('[data-glx]') : null;
    if (!b) return;
    gmSync();
    GME.gls.splice(Number(b.getAttribute('data-glx')), 1);
    gmForm();
  };
  if ($('gm-del')) $('gm-del').onclick = function(){
    if (!confirm('Удалить эту игру?')) return;
    api({ a:'game2del', id: g.id }, function(){ mClose(); GM.list = null; gmLoad(true); });
  };
  $('gm-save').onclick = function(){
    gmSync();
    if (!GME.gk){ alert('Выбери вратаря.'); return; }
    $('gm-save').textContent = 'Сохраняю…';
    api({ a:'game2save', id: GME.id, d: GME.d, gk: GME.gk, uid: GME.uid, opp: GME.opp,
          home: GME.home, res: GME.res, sh: GME.sh, ga: GME.ga, gmp: GME.gmp, gmm: GME.gmm,
          load: GME.load, psy: GME.psy, cm: GME.cm, gls: GME.gls, sk: GME.sk }, function(res){
      if (!res || !res.ok){ $('gm-save').textContent = 'Не вышло, ещё раз'; return; }
      mClose(); GM.list = null; gmLoad(true);
    });
  };
}

function gmSync(){
  var v = function(id){ var el = $('f-' + id); return el ? el.value : ''; };
  var sel = $('f-gk'), opt = sel ? sel.options[sel.selectedIndex] : null;
  GME.d    = v('d');
  GME.gk   = sel ? sel.value : '';
  GME.uid  = opt ? (opt.getAttribute('data-uid') || '') : '';
  GME.opp  = v('opp').trim();
  GME.home = Number(v('home'));
  GME.res  = v('res');
  GME.load = v('load');
  GME.sh   = Number(v('sh'))  || 0;
  GME.ga   = Number(v('ga'))  || 0;
  GME.gmp  = Number(v('gmp')) || 0;
  GME.gmm  = Number(v('gmm')) || 0;
  GME.psy  = Number(v('psy')) || 0;
  GME.cm   = v('cm');
  var gls = [];
  $('mbody').querySelectorAll('[data-gl]').forEach(function(row){
    gls.push({ s: row.querySelector('[data-gf="s"]').value,
               d: row.querySelector('[data-gf="d"]').value.trim(),
               z: Number(row.querySelector('[data-gf="z"]').value) || '' });
  });
  GME.gls = gls;
  var sk = {};
  $('mbody').querySelectorAll('[data-sk]').forEach(function(row){
    var q = function(f){ return Number(row.querySelector('[data-sf="' + f + '"]').value) || 0; };
    var n = q('n'), ok = q('ok'), e = q('e');
    if (!n && !ok && !e) return;
    if (!n) n = ok + e;
    sk[row.getAttribute('data-sk')] = { n: n, ok: ok, e: e };
  });
  GME.sk = sk;
}

/* ───────── аналитика голов ───────── */
var AN = { gk: '', from: '', to: '', src: 'games', pgk: '' };
var ZNAMES = ['верх левый','верх центр','верх правый',
              'средн левый','средн центр','средн правый',
              'низ левый','низ центр','низ правый'];

function anLoad(){
  if (AN.src !== 'games'){ preDraw(); return; }
  if (!GM.list){
    var sec = $('main').querySelector('[data-pg="goals"]');
    sec.innerHTML = '<div class="head"><h1>Аналитика голов</h1></div>' +
                    '<div class="card"><div class="muted">Загружаю…</div></div>';
    api({ a:'games2' }, function(res){
      if (!res || !res.ok){
        sec.innerHTML = '<div class="head"><h1>Аналитика голов</h1></div>' +
          '<div class="card"><div class="muted">Не удалось загрузить.</div></div>';
        return;
      }
      GM.list = res.list || []; GM.sit = res.sit || []; GM.sk = res.sk || [];
      anDraw();
    });
    return;
  }
  anDraw();
}

function anDraw(){
  var sec = $('main').querySelector('[data-pg="goals"]');
  var list = (GM.list || []).filter(function(g){
    if (AN.gk && g.gk !== AN.gk) return false;
    if (AN.from && g.d < AN.from) return false;
    if (AN.to   && g.d > AN.to)   return false;
    return true;
  });

  var zones = [0,0,0,0,0,0,0,0,0], sits = {}, dets = {}, total = 0, shots = 0;
  list.forEach(function(g){
    shots += g.sh;
    (g.gls || []).forEach(function(x){
      total++;
      var z = Number(x.z) || 0;
      if (z >= 1 && z <= 9) zones[z - 1]++;
      var sname = x.s || 'Другое';
      sits[sname] = (sits[sname] || 0) + 1;
      if (x.d){
        if (!dets[sname]) dets[sname] = {};
        dets[sname][x.d] = (dets[sname][x.d] || 0) + 1;
      }
    });
  });

  var zmax = Math.max.apply(null, zones) || 1;
  var net = zones.map(function(n, i){
    var k = n / zmax;
    var style = n ? ' style="background:rgba(214,17,46,' + (0.18 + k * 0.72).toFixed(2) + ')"' : '';
    return '<div class="z' + (n && k > 0.55 ? ' hot' : '') + '"' + style + '>' +
           '<b>' + (n || '') + '</b><i>' + ZNAMES[i] + '</i></div>';
  }).join('');

  var arr = Object.keys(sits).map(function(k){ return { s:k, n:sits[k] }; })
                  .sort(function(a,b){ return b.n - a.n; });
  var smax = arr.length ? arr[0].n : 1;
  var bars = arr.map(function(x){
    var d = dets[x.s] ? Object.keys(dets[x.s]).sort(function(a,b){ return dets[x.s][b] - dets[x.s][a]; })
              .map(function(k){ return esc(k) + ' ' + dets[x.s][k]; }).join(' · ') : '';
    return '<div class="bar"><div class="nm">' + esc(x.s) + '</div>' +
           '<div class="ln"><u style="width:' + Math.round(x.n / smax * 100) + '%"></u></div>' +
           '<div class="vl"><b>' + x.n + '</b> · ' + (total ? Math.round(x.n / total * 1000) / 10 : 0) + '%</div></div>' +
           (d ? '<div class="dets" style="margin:-4px 0 2px 160px">' + d + '</div>' : '');
  }).join('');

  var names = {};
  (GM.list || []).forEach(function(g){ if (g.gk) names[g.gk] = 1; });
  var opts = '<option value="">Все вратари</option>' + Object.keys(names).sort().map(function(x){
    return '<option' + (x === AN.gk ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('');

  var byGk = {};
  list.forEach(function(g){
    var k = g.gk || '—';
    if (!byGk[k]) byGk[k] = { n:0, sh:0, ga:0 };
    byGk[k].n++; byGk[k].sh += g.sh; byGk[k].ga += g.ga;
  });
  var gkRows = Object.keys(byGk).sort().map(function(k){
    var b = byGk[k], pct = b.sh ? Math.round((b.sh - b.ga) / b.sh * 1000) / 10 : null;
    return '<tr><td class="gk">' + esc(k) + '</td><td class="num">' + b.n + '</td>' +
           '<td class="num">' + b.sh + '</td><td class="num">' + b.ga + '</td>' +
           '<td class="num"><b>' + (pct === null ? '—' : pct + '%') + '</b></td></tr>';
  }).join('');

  sec.innerHTML =
    '<div class="head"><h1>Аналитика голов</h1>' +
    '<div class="sub">собирается из голов, записанных в карточках игр</div></div>' +

    anBar('an-gk', opts) +

    '<div class="kpi">' +
      '<div class="kp"><b>' + list.length + '</b><i>игр в выборке</i></div>' +
      '<div class="kp"><b>' + total + '</b><i>голов записано</i></div>' +
      '<div class="kp"><b>' + (shots ? Math.round((shots - total) / shots * 1000) / 10 + '%' : '—') +
        '</b><i>отражено от ' + shots + ' бросков</i></div>' +
      '<div class="kp"><b>' + (list.length ? Math.round(total / list.length * 10) / 10 : '—') +
        '</b><i>голов за игру</i></div>' +
    '</div>' +

    '<div class="anwrap">' +
      '<div class="card"><h2>Куда забивают</h2>' +
        '<div class="goal">' + net + '</div>' +
        '<div class="ice">вид со стороны броска · чем темнее, тем чаще</div></div>' +
      '<div class="card"><h2>Ситуации</h2>' +
        (arr.length ? '<div class="bars">' + bars + '</div>'
                    : '<div class="muted">Голы пока не записаны. Заноси их в карточке игры.</div>') +
      '</div>' +
    '</div>' +

    (gkRows ? '<div class="card"><h2>По вратарям</h2><table class="tbl"><thead><tr>' +
      '<th>Вратарь</th><th class="num">Игр</th><th class="num">БВ</th><th class="num">ПШ</th>' +
      '<th class="num">Отражено</th></tr></thead><tbody>' + gkRows + '</tbody></table></div>' : '');

  $('an-gk').onchange = function(){ AN.gk = this.value; anDraw(); };
  sec.querySelector('.mcbar').onclick = function(e){
    var b = e.target.closest ? e.target.closest('[data-as]') : null;
    if (!b) return;
    AN.src = b.getAttribute('data-as');
    if (AN.src === 'games') anDraw(); else preDraw();
  };
}

/* ───────── команда: один срез на три раздела ───────── */
var SQ = { list:null, bad:0, busy:0, wait:[] };

function sqLoad(cb){
  if (SQ.list && !SQ.bad){ cb(); return; }
  SQ.wait.push(cb);
  if (SQ.busy) return;
  SQ.busy = 1;
  api({ a:'squad' }, function(res){
    SQ.busy = 0;
    var ok = res && res.ok;
    SQ.list = ok ? (res.list || []) : [];
    SQ.bad  = ok ? 0 : 1;
    var w = SQ.wait; SQ.wait = [];
    w.forEach(function(f){ f(); });
  });
}
function pgWait(p, title){
  var sec = $('main').querySelector('[data-pg="' + p + '"]');
  if (sec && !sec.getAttribute('data-l')){
    sec.setAttribute('data-l', '1');
    sec.innerHTML = '<div class="head"><h1>' + esc(title) + '</h1></div>' +
                    '<div class="card"><div class="muted">Собираю данные по вратарям…</div></div>';
  }
}
function sqFail(p, title){
  var sec = $('main').querySelector('[data-pg="' + p + '"]');
  sec.innerHTML = '<div class="head"><h1>' + esc(title) + '</h1></div>' +
    '<div class="card"><div class="muted">Данные не пришли. Обнови страницу - первый запрос иногда не успевает.</div></div>';
}
function dsh(iso){ if (!iso) return '—'; var d = new Date(iso + 'T00:00:00');
  return d.getDate() + '.' + ('0' + (d.getMonth() + 1)).slice(-2); }
function nz(v, d){ return (v === null || v === undefined || v === '' || isNaN(v)) ? (d || '—') : v; }
function sqBy(uid){ var r = null; (SQ.list || []).forEach(function(x){ if (x.uid === uid) r = x; }); return r; }

var SECN = [['skat','Катание'],['catch','Ловля'],['tac','Тактика'],['psy','Психология'],['phys','Физика']];
var SECO = { tech:'Техника', tac:'Тактика', mind:'Мышление', psy:'Психология', phys:'Физика' };

var COG = [
  { k:'schulte', t:'Шульте', u:'сек', dir:'min',
    v:function(x){ return x.t; },
    ex:function(x){ return (x.n ? x.n + ' чисел' : '') + (x.e ? ' · ошибок ' + x.e : ''); } },
  { k:'svet', t:'Светофон', u:'мс', dir:'min',
    v:function(x){ return x.rt; },
    ex:function(x){ return (x.n ? 'точность ' + Math.round(x.ok / x.n * 100) + '%' : '') +
                           (x.e ? ' · ошибок ' + x.e : '') + (x.sk ? ' · пропусков ' + x.sk : '') +
                           (x.ms ? ' · окно ' + x.ms + ' мс' : ''); } },
  { k:'stroop', t:'Струп', u:'%', dir:'max',
    v:function(x){ return x.n ? Math.round(x.ok / x.n * 1000) / 10 : null; },
    ex:function(x){ return (x.n ? x.ok + ' из ' + x.n : '') + (x.e ? ' · ошибок ' + x.e : '') +
                           (x.sk ? ' · пропусков ' + x.sk : ''); } },
  { k:'mot', t:'Слежение', u:'порог', dir:'max',
    v:function(x){ return x.sp ? Math.round(x.sp * 100) : null; },
    ex:function(x){ return (x.n ? 'попаданий ' + x.ok + ' из ' + x.n : '') +
                           (x.tg ? ' · целей ' + x.tg : '') + (x.bl ? ' · помех ' + x.bl : ''); } },
  { k:'gng', t:'Реакция с помехами', u:'%', dir:'max',
    v:function(x){ return x.n ? Math.round(x.ok / x.n * 1000) / 10 : null; },
    ex:function(x){ return (x.n ? x.ok + ' из ' + x.n : '') + (x.e ? ' · ошибок ' + x.e : '') +
                           (x.lv ? ' · уровень ' + x.lv : ''); } }
];
function cogCfg(k){ var r = COG[0]; COG.forEach(function(c){ if (c.k === k) r = c; }); return r; }
function cogN(c){
  if (!c) return 0;
  var n = 0;
  COG.forEach(function(x){ n += (c[x.k] || []).length; });
  return n;
}

/* ───────── все вратари ───────── */

function rsLoad(){ pgWait('roster', 'Все вратари'); sqLoad(rsDraw); }

function rsDraw(){
  if (SQ.bad) return sqFail('roster', 'Все вратари');
  var sec = $('main').querySelector('[data-pg="roster"]');
  var list = SQ.list || [], wk = shift(TODAY, -7);

  var act = 0, cogAll = 0, wbAll = 0;
  list.forEach(function(x){
    if (x.lastWb && x.lastWb >= wk) act++;
    cogAll += cogN(x.cog); wbAll += x.wbN;
  });

  var rows = list.map(function(x){
    var rad = (x.rad || [])[0], old = x.lastWb && x.lastWb < wk;
    return '<tr data-uid="' + esc(x.uid) + '">' +
      '<td class="gk">' + esc(x.name) + '</td>' +
      '<td>' + esc(x.team || '—') + '</td>' +
      '<td class="num">' + esc(x.year || '—') + '</td>' +
      '<td class="num">' + x.wbN + '</td>' +
      '<td class="num"' + (old ? ' style="color:var(--warn)"' : '') + '>' + dsh(x.lastWb) + '</td>' +
      '<td class="num">' + x.trN + '</td>' +
      '<td class="num">' + (x.rad || []).length + '</td>' +
      '<td class="num"><b>' + (rad ? rad.avg : '—') + '</b></td>' +
      '<td class="num">' + cogN(x.cog) + '</td></tr>';
  }).join('');

  sec.innerHTML =
    '<div class="head"><h1>Все вратари</h1>' +
    '<div class="sub">нажми на вратаря, чтобы открыть карточку</div></div>' +
    '<div class="kpi">' +
      '<div class="kp"><b>' + list.length + '</b><i>вратарей в системе</i></div>' +
      '<div class="kp"><b>' + act + '</b><i>писали дневник за 7 дней</i></div>' +
      '<div class="kp"><b>' + wbAll + '</b><i>записей самочувствия</i></div>' +
      '<div class="kp"><b>' + cogAll + '</b><i>замеров когнитивки</i></div>' +
    '</div>' +
    '<div class="card"><h2>Состав</h2><table class="tbl"><thead><tr>' +
      '<th>Вратарь</th><th>Команда</th><th class="num">Год</th><th class="num">Дневник</th>' +
      '<th class="num">Посл. запись</th><th class="num">Тренировок</th><th class="num">Оценок</th>' +
      '<th class="num">Средняя</th><th class="num">Когнитивка</th>' +
      '</tr></thead><tbody>' + (rows || '<tr><td colspan="9" class="muted">Пусто.</td></tr>') +
      '</tbody></table></div>';

  sec.querySelector('tbody').onclick = function(e){
    var tr = e.target.closest ? e.target.closest('tr[data-uid]') : null;
    if (tr) rsCard(tr.getAttribute('data-uid'));
  };
}

function rsCard(uid){
  var x = sqBy(uid);
  if (!x) return;

  var wb = (x.wb || []).slice(0, 10).map(function(r){
    return '<tr><td class="num">' + dsh(r.d) + '</td>' +
      '<td class="num">' + nz(r.sl) + '</td><td class="num">' + nz(r.rd) + '</td>' +
      '<td class="num">' + nz(r.f) + '</td><td class="num">' + nz(r.sor) + '</td>' +
      '<td class="num">' + nz(r.mo) + '</td><td class="num">' + nz(r.pf) + '</td>' +
      '<td class="num">' + nz(r.p) + '</td><td class="num">' + nz(r.w) + '</td></tr>';
  }).join('');

  var rad = (x.rad || [])[0];
  var radHtml = rad ? radBars(rad) : '<div class="muted">Оценок пока нет.</div>';

  var cg = COG.map(function(c){
    var arr = (x.cog && x.cog[c.k]) || [];
    if (!arr.length) return '';
    var l = arr[0], v = c.v(l);
    return '<div class="bar" style="grid-template-columns:170px 1fr 90px">' +
      '<div class="nm">' + c.t + '</div>' +
      '<div class="ln" style="background:none;color:var(--tx2);font-size:12.5px;height:auto">' +
        esc(c.ex(l)) + '</div>' +
      '<div class="vl"><b>' + nz(v) + '</b> ' + c.u + '</div></div>';
  }).join('');

  mOpen(
    '<h2>' + esc(x.name) + '</h2>' +
    '<div class="ms">' + esc(x.team || '—') + (x.year ? ' · ' + esc(x.year) : '') +
      ' · записей дневника ' + x.wbN + ' · заходил ' + esc(x.seen || '—') + '</div>' +
    (x.goal ? '<div class="fld"><label>Цель сезона</label><div style="font-size:14px;line-height:1.55">' +
       esc(x.goal) + '</div></div>' : '') +
    '<div class="card" style="margin:0 0 14px"><h2>Оценка</h2>' + radHtml +
      (rad ? '<div class="dets">' + dsh(rad.d) + ' · ' +
        (rad.by === 'coach' ? 'тренер' : 'самооценка') + (rad.cm ? ' · ' + esc(rad.cm) : '') + '</div>' : '') +
    '</div>' +
    (cg ? '<div class="card" style="margin:0 0 14px"><h2>Когнитивка, последние замеры</h2>' +
       '<div class="bars">' + cg + '</div></div>' : '') +
    '<div class="card" style="margin:0"><h2>Самочувствие</h2>' +
      (wb ? '<table class="tbl"><thead><tr><th class="num">Дата</th><th class="num">Сон</th>' +
        '<th class="num">Готов</th><th class="num">Устал</th><th class="num">Крепат</th>' +
        '<th class="num">Настр</th><th class="num">Психол</th><th class="num">Пульс</th>' +
        '<th class="num">Вес</th></tr></thead><tbody>' + wb + '</tbody></table>'
         : '<div class="muted">Записей нет.</div>') +
    '</div>' +
    '<div class="mact"><div class="sp"></div><button class="btn sec sm" id="rc-x">Закрыть</button></div>'
  );
  $('rc-x').onclick = mClose;
}

function radBars(rad){
  var pairs = rad.old ? Object.keys(rad.sec).map(function(k){ return [k, SECO[k] || k]; })
                      : SECN;
  var out = pairs.map(function(p){
    var v = rad.sec[p[0]];
    if (v === undefined) return '';
    return '<div class="bar" style="grid-template-columns:120px 1fr 54px">' +
      '<div class="nm">' + p[1] + '</div>' +
      '<div class="ln"><u style="width:' + Math.round(v / 10 * 100) + '%"></u></div>' +
      '<div class="vl"><b>' + v + '</b></div></div>';
  }).join('');
  return '<div class="bars">' + out + '</div>';
}

/* ───────── оценки ───────── */

var RT = { gk:'' };

function rtLoad(){ pgWait('rates', 'Оценки'); sqLoad(rtDraw); }

function rtDraw(){
  if (SQ.bad) return sqFail('rates', 'Оценки');
  var sec = $('main').querySelector('[data-pg="rates"]');
  var list = SQ.list || [];

  var opts = '<option value="">Все вратари</option>' + list.map(function(x){
    return '<option value="' + esc(x.uid) + '"' + (x.uid === RT.gk ? ' selected' : '') + '>' +
      esc(x.name) + '</option>'; }).join('');

  var body;
  if (RT.gk){
    var x = sqBy(RT.gk) || { rad:[] };
    var rad = x.rad || [];
    var hist = rad.map(function(r){
      return '<tr><td class="num">' + dsh(r.d) + '</td>' +
        '<td>' + (r.by === 'coach' ? 'тренер' : 'сам') + '</td>' +
        SECN.map(function(p){ return '<td class="num">' + nz(r.sec[p[0]]) + '</td>'; }).join('') +
        '<td class="num"><b>' + r.avg + '</b></td>' +
        '<td class="muted">' + esc(r.cm || '') + '</td></tr>';
    }).join('');
    body =
      '<div class="card"><h2>Последняя оценка</h2>' +
        (rad[0] ? radBars(rad[0]) + '<div class="dets">' + dsh(rad[0].d) + ' · ' +
           (rad[0].by === 'coach' ? 'тренер' : 'самооценка') + ' · средняя ' + rad[0].avg + '</div>'
                : '<div class="muted">Оценок нет.</div>') +
      '</div>' +
      (hist ? '<div class="card"><h2>История</h2><table class="tbl"><thead><tr>' +
        '<th class="num">Дата</th><th>Кто</th>' +
        SECN.map(function(p){ return '<th class="num">' + p[1] + '</th>'; }).join('') +
        '<th class="num">Средняя</th><th>Комментарий</th></tr></thead><tbody>' + hist +
        '</tbody></table></div>' : '');
  } else {
    var rows = list.map(function(x){
      var r = (x.rad || [])[0];
      if (!r) return '<tr data-uid="' + esc(x.uid) + '"><td class="gk">' + esc(x.name) + '</td>' +
        '<td class="num">—</td><td></td>' + SECN.map(function(){ return '<td class="num">—</td>'; }).join('') +
        '<td class="num">—</td></tr>';
      return '<tr data-uid="' + esc(x.uid) + '"><td class="gk">' + esc(x.name) + '</td>' +
        '<td class="num">' + dsh(r.d) + '</td>' +
        '<td>' + (r.by === 'coach' ? 'тренер' : 'сам') + '</td>' +
        SECN.map(function(p){ return '<td class="num">' + nz(r.sec[p[0]]) + '</td>'; }).join('') +
        '<td class="num"><b>' + r.avg + '</b></td></tr>';
    }).join('');

    var sum = {}, cnt = {};
    list.forEach(function(x){
      var r = (x.rad || [])[0];
      if (!r) return;
      SECN.forEach(function(p){
        var v = r.sec[p[0]];
        if (v === undefined) return;
        sum[p[0]] = (sum[p[0]] || 0) + v; cnt[p[0]] = (cnt[p[0]] || 0) + 1;
      });
    });
    var team = SECN.map(function(p){
      if (!cnt[p[0]]) return '';
      var v = Math.round(sum[p[0]] / cnt[p[0]] * 10) / 10;
      return '<div class="bar" style="grid-template-columns:120px 1fr 54px">' +
        '<div class="nm">' + p[1] + '</div>' +
        '<div class="ln"><u style="width:' + Math.round(v / 10 * 100) + '%"></u></div>' +
        '<div class="vl"><b>' + v + '</b></div></div>';
    }).join('');

    body =
      '<div class="anwrap" style="grid-template-columns:1fr 340px">' +
        '<div class="card"><h2>По вратарям</h2><table class="tbl"><thead><tr>' +
          '<th>Вратарь</th><th class="num">Дата</th><th>Кто</th>' +
          SECN.map(function(p){ return '<th class="num">' + p[1] + '</th>'; }).join('') +
          '<th class="num">Средняя</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<div class="card"><h2>Средняя по команде</h2>' +
          (team ? '<div class="bars">' + team + '</div>' : '<div class="muted">Оценок нет.</div>') +
          '<div class="ice">по последней оценке каждого вратаря</div></div>' +
      '</div>';
  }

  sec.innerHTML =
    '<div class="head"><h1>Оценки</h1>' +
    '<div class="sub">33 пункта, сведённые в пять разделов</div><div class="sp"></div>' +
    '<select id="rt-gk" style="height:38px;border:1px solid var(--line);border-radius:10px;' +
      'background:var(--bg2);color:var(--tx);font-family:inherit;font-size:13.5px;padding:0 10px">' +
      opts + '</select></div>' + body;

  $('rt-gk').onchange = function(){ RT.gk = this.value; rtDraw(); };
  var tb = sec.querySelector('tbody');
  if (tb && !RT.gk) tb.onclick = function(e){
    var tr = e.target.closest ? e.target.closest('tr[data-uid]') : null;
    if (tr){ RT.gk = tr.getAttribute('data-uid'); rtDraw(); }
  };
}

/* ───────── когнитивка ───────── */

var CG = { k:'schulte', gk:'' };

function cgLoad(){ pgWait('cog', 'Когнитивка'); sqLoad(cgDraw); }

function cgDraw(){
  if (SQ.bad) return sqFail('cog', 'Когнитивка');
  var sec = $('main').querySelector('[data-pg="cog"]');
  var list = SQ.list || [], c = cogCfg(CG.k);

  var chips = COG.map(function(x){
    var n = 0;
    list.forEach(function(g){ n += ((g.cog && g.cog[x.k]) || []).length; });
    return '<button class="mcb' + (x.k === CG.k ? ' on' : '') + '" data-ck="' + x.k + '">' +
      x.t + ' <span style="opacity:.6">' + n + '</span></button>';
  }).join('');

  var best = null, worst = null;
  var rows = list.map(function(g){
    var arr = ((g.cog && g.cog[c.k]) || []).slice().sort(function(a, b){ return a.d < b.d ? 1 : -1; });
    if (!arr.length) return '';
    var last = arr[0], prev = arr[1];
    var v = c.v(last), pv = prev ? c.v(prev) : null;
    var vals = arr.map(c.v).filter(function(z){ return z !== null && z !== undefined && !isNaN(z); });
    var rec = vals.length ? (c.dir === 'min' ? Math.min.apply(null, vals) : Math.max.apply(null, vals)) : null;

    var dlt = '';
    if (pv !== null && pv !== undefined && v !== null && v !== undefined){
      var df = Math.round((v - pv) * 10) / 10;
      var good = c.dir === 'min' ? df < 0 : df > 0;
      if (df) dlt = '<span style="color:' + (good ? 'var(--ok)' : 'var(--red)') + '">' +
        (df > 0 ? '+' : '') + df + '</span>';
      else dlt = '<span class="muted">0</span>';
    }
    if (v !== null && v !== undefined){
      if (!best  || (c.dir === 'min' ? v < best.v  : v > best.v))  best  = { n:g.name, v:v };
      if (!worst || (c.dir === 'min' ? v > worst.v : v < worst.v)) worst = { n:g.name, v:v };
    }
    return '<tr data-uid="' + esc(g.uid) + '"' + (g.uid === CG.gk ? ' style="background:var(--bg3)"' : '') + '>' +
      '<td class="gk">' + esc(g.name) + '</td>' +
      '<td class="num">' + arr.length + '</td>' +
      '<td class="num">' + dsh(last.d) + '</td>' +
      '<td class="num"><b>' + nz(v) + '</b></td>' +
      '<td class="num">' + (dlt || '—') + '</td>' +
      '<td class="num">' + nz(rec) + '</td>' +
      '<td class="muted">' + esc(c.ex(last)) + '</td></tr>';
  }).join('');

  var det = '';
  if (CG.gk){
    var g = sqBy(CG.gk);
    if (g){
      var arr = ((g.cog && g.cog[c.k]) || []).slice().sort(function(a, b){ return a.d < b.d ? 1 : -1; });
      var hv = arr.map(c.v).filter(function(z){ return z !== null && z !== undefined && !isNaN(z); });
      var hmax = hv.length ? Math.max.apply(null, hv) : 1;
      var hmin = hv.length ? Math.min.apply(null, hv) : 0;
      det = '<div class="card"><h2>' + esc(g.name) + ' · ' + c.t + '</h2>' +
        (arr.length ? '<div class="bars">' + arr.slice(0, 20).map(function(r){
          var v = c.v(r);
          var w = (hmax === hmin) ? 100 : Math.round(((v - hmin) / (hmax - hmin) * 0.8 + 0.2) * 100);
          return '<div class="bar" style="grid-template-columns:64px 1fr 70px">' +
            '<div class="nm">' + dsh(r.d) + '</div>' +
            '<div class="ln"><u style="width:' + (isNaN(w) ? 0 : w) + '%"></u></div>' +
            '<div class="vl"><b>' + nz(v) + '</b> ' + c.u + '</div></div>' +
            '<div class="dets" style="margin:-4px 0 2px 74px">' + esc(c.ex(r)) + '</div>';
        }).join('') + '</div>' : '<div class="muted">Замеров нет.</div>') +
        '<div class="ice">' + (c.dir === 'min' ? 'чем меньше, тем лучше' : 'чем больше, тем лучше') +
        ' · нажми на вратаря в таблице, чтобы сменить</div></div>';
    }
  }

  if (best && worst && best.n === worst.n) worst = null;

  sec.innerHTML =
    '<div class="head"><h1>Когнитивка</h1>' +
    '<div class="sub">замеры из приложения вратаря</div></div>' +
    '<div class="mcbar">' + chips + '</div>' +
    '<div class="kpi">' +
      '<div class="kp"><b>' + (best ? best.v : '—') + '</b><i>лучший: ' +
        esc(best ? best.n : '—') + '</i></div>' +
      '<div class="kp"><b>' + (worst ? worst.v : '—') + '</b><i>слабее всех: ' +
        esc(worst ? worst.n : '—') + '</i></div>' +
      '<div class="kp"><b>' + c.u + '</b><i>' +
        (c.dir === 'min' ? 'меньше - лучше' : 'больше - лучше') + '</i></div>' +
    '</div>' +
    '<div class="card"><h2>' + c.t + '</h2>' +
      '<table class="tbl"><thead><tr><th>Вратарь</th><th class="num">Замеров</th>' +
      '<th class="num">Дата</th><th class="num">Последний</th><th class="num">Сдвиг</th>' +
      '<th class="num">Лучший</th><th>Подробности</th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="7" class="muted">По этому тесту замеров нет.</td></tr>') +
      '</tbody></table></div>' + det;

  sec.querySelector('.mcbar').onclick = function(e){
    var b = e.target.closest ? e.target.closest('[data-ck]') : null;
    if (b){ CG.k = b.getAttribute('data-ck'); cgDraw(); }
  };
  var tb = sec.querySelector('tbody');
  if (tb) tb.onclick = function(e){
    var tr = e.target.closest ? e.target.closest('tr[data-uid]') : null;
    if (tr){
      var u = tr.getAttribute('data-uid');
      CG.gk = (CG.gk === u) ? '' : u;
      cgDraw();
    }
  };
}

/* ───────── ОФП ───────── */

var OF = { tests:null, list:null, tab:'test', t:'', gk:'', mc:'' };

function ofLoad(fresh){
  var sec = $('main').querySelector('[data-pg="ofp"]');
  if (OF.tests && !fresh){ ofDraw(); return; }
  sec.innerHTML = '<div class="head"><h1>ОФП</h1></div>' +
                  '<div class="card"><div class="muted">Загружаю…</div></div>';
  api({ a:'ofp' }, function(res){
    if (!res || !res.ok){
      sec.innerHTML = '<div class="head"><h1>ОФП</h1></div>' +
        '<div class="card"><div class="muted">Не удалось загрузить. Проверь, что в базе есть листы «офп» и «офп_тесты».</div></div>';
      return;
    }
    OF.tests = res.tests || [];
    OF.list  = res.list  || [];
    ofDraw();
  });
}

/** Все, у кого есть замеры, плюс все из состава. */
function ofNames(){
  var by = {};
  (ROSTER || []).forEach(function(r){ if (r.name) by[r.name] = r.uid || ''; });
  (OF.list || []).forEach(function(x){ if (x.gk && by[x.gk] === undefined) by[x.gk] = x.uid || ''; });
  return Object.keys(by).sort().map(function(n){ return { name:n, uid:by[n] }; });
}
function ofTest(code){ var r = null; (OF.tests || []).forEach(function(t){ if (t.code === code) r = t; }); return r; }

/** Замеры вратаря по тесту, новые вперёд. */
function ofOf(name, code){
  return (OF.list || []).filter(function(x){ return x.gk === name && x.t === code; })
    .sort(function(a, b){ return a.d < b.d ? 1 : -1; });
}
/** Выполнен ли норматив. */
function ofOk(t, v){
  if (!t || !t.norm || v === null || v === undefined || isNaN(v)) return null;
  return t.dir === 'min' ? (v <= t.norm) : (v >= t.norm);
}

function ofDraw(){
  var sec = $('main').querySelector('[data-pg="ofp"]');
  sec.innerHTML =
    '<div class="head"><h1>ОФП</h1>' +
    '<div class="sub">' + (OF.tab === 'test' ? 'результаты тестирования и нормативы'
                                             : 'что делаем по ОФП в каждом микроцикле') + '</div>' +
    '<div class="sp"></div>' +
    (OF.tab === 'test'
      ? '<button class="btn sec sm" id="of-add">+ Внести замеры</button>' +
        '<button class="btn sec sm" id="of-cfg" style="margin-left:8px">Тесты и нормативы</button>'
      : '') +
    '</div>' +
    '<div class="mcbar">' +
      '<button class="mcb' + (OF.tab === 'test' ? ' on' : '') + '" data-ot="test">Тестирование</button>' +
      '<button class="mcb' + (OF.tab === 'plan' ? ' on' : '') + '" data-ot="plan">План по микроциклам</button>' +
    '</div>' +
    '<div id="of-body"></div>';

  sec.querySelector('.mcbar').onclick = function(e){
    var b = e.target.closest ? e.target.closest('[data-ot]') : null;
    if (b){ OF.tab = b.getAttribute('data-ot'); ofDraw(); }
  };
  var ab = $('of-add'); if (ab) ab.onclick = function(){ ofDayEdit('', ''); };
  var cb = $('of-cfg'); if (cb) cb.onclick = ofCfg;

  if (OF.tab === 'test') ofTestsDraw(); else ofPlanDraw();
}

/* ── вкладка «Тестирование» ── */

function ofTestsDraw(){
  var box = $('of-body');
  var tests = OF.tests || [], names = ofNames();

  if (!tests.length){
    box.innerHTML = '<div class="card"><div class="muted">Справочник тестов пуст. ' +
      'Нажми «Тесты и нормативы» и добавь первый.</div></div>';
    return;
  }

  /* матрица: вратари × тесты, последний результат */
  var head = '<tr><th>Вратарь</th>' + tests.map(function(t){
    return '<th class="num" data-ot="' + esc(t.code) + '" style="cursor:pointer' +
      (t.code === OF.t ? ';color:var(--red)' : '') + '" title="' + esc(t.note) + '">' +
      esc(t.name) + '<br><span style="font-weight:400;text-transform:none">' +
      (t.norm ? (t.dir === 'min' ? '≤ ' : '≥ ') + t.norm + ' ' : '') + esc(t.unit) + '</span></th>';
  }).join('') + '</tr>';

  var body = names.map(function(p){
    var cells = tests.map(function(t){
      var arr = ofOf(p.name, t.code);
      if (!arr.length) return '<td class="num muted">—</td>';
      var v = arr[0].v, ok = ofOk(t, v);
      var col = ok === null ? '' : (ok ? ';color:var(--ok);font-weight:700' : ';color:var(--red)');
      return '<td class="num" style="cursor:pointer' + col + '" data-cell="' + esc(p.name) +
        '|' + esc(t.code) + '" title="' + dsh(arr[0].d) + (arr[0].cm ? ' · ' + esc(arr[0].cm) : '') +
        '">' + v + '</td>';
    }).join('');
    return '<tr><td class="gk" data-row="' + esc(p.name) + '" style="cursor:pointer">' +
      esc(p.name) + '</td>' + cells + '</tr>';
  }).join('');

  var det = '';
  if (OF.t){
    var t = ofTest(OF.t);
    if (t){
      var rows = names.map(function(p){
        var arr = ofOf(p.name, t.code);
        if (!arr.length) return null;
        var v = arr[0].v, pv = arr[1] ? arr[1].v : null;
        return { n:p.name, v:v, d:arr[0].d, pv:pv, all:arr };
      }).filter(Boolean);
      rows.sort(function(a, b){ return t.dir === 'min' ? a.v - b.v : b.v - a.v; });

      var vals = rows.map(function(r){ return r.v; });
      var mx = vals.length ? Math.max.apply(null, vals) : 1;
      var bars = rows.map(function(r){
        var ok = ofOk(t, r.v);
        var dlt = '';
        if (r.pv !== null){
          var df = Math.round((r.v - r.pv) * 100) / 100;
          var good = t.dir === 'min' ? df < 0 : df > 0;
          if (df) dlt = ' <span style="color:' + (good ? 'var(--ok)' : 'var(--red)') + '">' +
            (df > 0 ? '+' : '') + df + '</span>';
        }
        return '<div class="bar" style="grid-template-columns:160px 1fr 120px">' +
          '<div class="nm">' + esc(r.n) + '</div>' +
          '<div class="ln"><u style="width:' + Math.round(r.v / mx * 100) + '%' +
            (ok ? ';background:var(--ok)' : '') + '"></u></div>' +
          '<div class="vl"><b>' + r.v + '</b> ' + esc(t.unit) + dlt + '</div></div>';
      }).join('');

      var hist = '';
      if (OF.gk){
        var arr = ofOf(OF.gk, t.code);
        hist = '<div class="card"><h2>' + esc(OF.gk) + ' · ' + esc(t.name) + '</h2>' +
          (arr.length ? '<table class="tbl"><thead><tr><th class="num">Дата</th>' +
            '<th class="num">Результат</th><th class="num">Норматив</th><th>Комментарий</th>' +
            '<th></th></tr></thead><tbody>' +
            arr.map(function(r){
              var ok = ofOk(t, r.v);
              return '<tr><td class="num">' + dsh(r.d) + '</td>' +
                '<td class="num"><b>' + r.v + '</b> ' + esc(t.unit) + '</td>' +
                '<td class="num">' + (ok === null ? '—' : (ok ? '<span style="color:var(--ok)">есть</span>'
                                                             : '<span style="color:var(--red)">нет</span>')) + '</td>' +
                '<td class="muted">' + esc(r.cm || '') + '</td>' +
                '<td class="num"><button class="del" data-oed="' + esc(r.gk) + '|' + r.d +
                  '">править день</button></td></tr>';
            }).join('') + '</tbody></table>' : '<div class="muted">Замеров нет.</div>') + '</div>';
      }

      det =
        '<div class="card"><h2>' + esc(t.name) + '</h2>' +
          (t.note ? '<div class="mcstage" style="margin-bottom:14px">' + esc(t.note) + '</div>' : '') +
          '<div class="dets" style="margin:0 0 12px">' +
            (t.norm ? 'Норматив: ' + (t.dir === 'min' ? 'не больше ' : 'не меньше ') + t.norm + ' ' +
                      esc(t.unit) + ' · ' : '') +
            (t.dir === 'min' ? 'меньше - лучше' : 'больше - лучше') +
            (t.teams ? ' · ' + esc(t.teams) : '') + '</div>' +
          (bars ? '<div class="bars">' + bars + '</div>'
                : '<div class="muted">По этому тесту замеров нет.</div>') +
        '</div>' + hist;
    }
  }

  box.innerHTML =
    '<div class="card"><h2>Последние результаты</h2>' +
      '<table class="tbl"><thead>' + head + '</thead><tbody>' +
      (body || '<tr><td class="muted">Вратарей нет.</td></tr>') + '</tbody></table>' +
      '<div class="ice">зелёным - норматив выполнен · нажми на название теста, чтобы раскрыть</div>' +
    '</div>' + det;

  box.onclick = function(e){
    var el = e.target.closest ? e.target : null;
    if (!el) return;
    var th = el.closest('[data-ot]');
    if (th){ OF.t = (OF.t === th.getAttribute('data-ot')) ? '' : th.getAttribute('data-ot');
             ofTestsDraw(); return; }
    var ed = el.closest('[data-oed]');
    if (ed){ var q = ed.getAttribute('data-oed').split('|'); ofDayEdit(q[0], q[1]); return; }
    var cell = el.closest('[data-cell]');
    if (cell){ var c = cell.getAttribute('data-cell').split('|');
               OF.gk = c[0]; OF.t = c[1]; ofTestsDraw(); return; }
    var row = el.closest('[data-row]');
    if (row){ ofDayEdit(row.getAttribute('data-row'), ''); return; }
  };
}

/* ── внесение замеров за день ── */

var OD = { gk:'', d:'' };

function ofDayEdit(gk, d){
  OD.gk = gk || '';
  OD.d  = d  || TODAY;
  var names = ofNames();
  var have = {};
  if (OD.gk && d) (OF.list || []).forEach(function(x){
    if (x.gk === OD.gk && x.d === d) have[x.t] = x.v;
  });

  var opts = '<option value="">— выбери —</option>' + names.map(function(p){
    return '<option' + (p.name === OD.gk ? ' selected' : '') + '>' + esc(p.name) + '</option>';
  }).join('');

  var fields = (OF.tests || []).map(function(t){
    return '<div class="row3" style="grid-template-columns:1fr 110px 70px">' +
      '<div class="fld" style="margin:0"><label>' + esc(t.name) +
        (t.norm ? ' · ' + (t.dir === 'min' ? '≤ ' : '≥ ') + t.norm : '') + '</label>' +
        '<div class="muted" style="font-size:12px">' + esc(t.note).slice(0, 90) + '</div></div>' +
      '<div class="fld" style="margin:0"><input id="of-' + esc(t.code) + '" inputmode="decimal" value="' +
        (have[t.code] !== undefined ? have[t.code] : '') + '"></div>' +
      '<div class="fld" style="margin:0"><div class="muted" style="padding-top:9px">' +
        esc(t.unit) + '</div></div>' +
    '</div>';
  }).join('');

  mOpen(
    '<h2>Замеры ОФП</h2>' +
    '<div class="ms">Заполняй только те тесты, что сдавали. Пустое поле - теста не было. ' +
    'Сохранение заменяет все замеры этого вратаря за эту дату.</div>' +
    '<div class="row2">' +
      '<div class="fld"><label>Вратарь</label><select id="of-gk">' + opts + '</select></div>' +
      '<div class="fld"><label>Дата</label><input id="of-d" type="date" value="' + OD.d + '"></div>' +
    '</div>' +
    fields +
    '<div class="fld"><label>Комментарий</label><input id="of-cm" value=""></div>' +
    '<div class="mact">' +
      '<button class="btn" id="of-save">Сохранить</button>' +
      '<button class="btn sec" id="of-cancel">Отмена</button>' +
    '</div>');

  $('of-cancel').onclick = mClose;
  $('of-save').onclick = function(){
    var gkv = $('of-gk').value, dv = $('of-d').value;
    if (!gkv){ alert('Выбери вратаря.'); return; }
    if (!dv){ alert('Поставь дату.'); return; }
    var uid = '';
    ofNames().forEach(function(p){ if (p.name === gkv) uid = p.uid; });
    var v = {};
    (OF.tests || []).forEach(function(t){
      var s = ($('of-' + t.code).value || '').trim();
      if (s !== '') v[t.code] = s;
    });
    $('of-save').textContent = 'Сохраняю…';
    api({ a:'ofpday', d: dv, gk: gkv, uid: uid, v: v, cm: ($('of-cm').value || '').trim() },
      function(res){
        if (!res || !res.ok){ $('of-save').textContent = 'Не вышло, ещё раз'; return; }
        mClose(); ofLoad(1);
      });
  };
}

/* ── справочник тестов ── */

function ofCfg(){
  var rows = (OF.tests || []).map(function(t){
    return '<tr><td class="gk" data-oc="' + esc(t.code) + '" style="cursor:pointer">' + esc(t.name) + '</td>' +
      '<td>' + esc(t.unit) + '</td>' +
      '<td>' + (t.dir === 'min' ? 'меньше' : 'больше') + '</td>' +
      '<td class="num">' + (t.norm || '—') + '</td>' +
      '<td class="muted">' + esc(t.teams) + '</td></tr>';
  }).join('');

  mOpen(
    '<h2>Тесты и нормативы</h2>' +
    '<div class="ms">Нажми на тест, чтобы изменить. Порядок задаётся числом в карточке теста.</div>' +
    '<table class="tbl"><thead><tr><th>Тест</th><th>Ед.</th><th>Лучше</th>' +
    '<th class="num">Норматив</th><th>Команды</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="mact"><button class="btn" id="oc-new">+ Новый тест</button>' +
    '<button class="btn sec" id="oc-close">Закрыть</button></div>');

  $('oc-close').onclick = mClose;
  $('oc-new').onclick = function(){ ofCfgEdit(''); };
  $('mbody').querySelector('tbody').onclick = function(e){
    var td = e.target.closest ? e.target.closest('[data-oc]') : null;
    if (td) ofCfgEdit(td.getAttribute('data-oc'));
  };
}

function ofCfgEdit(code){
  var t = ofTest(code) || { code:'', name:'', unit:'', dir:'max', norm:'', note:'', teams:'МХК, МАХ',
                            ord:(OF.tests || []).length + 1 };
  mOpen(
    '<h2>' + (code ? 'Тест' : 'Новый тест') + '</h2>' +
    '<div class="ms">Код - короткое латинское имя, по нему хранятся замеры. У готового теста его менять не нужно.</div>' +
    '<div class="row2">' +
      '<div class="fld"><label>Название</label><input id="oc-name" value="' + esc(t.name) + '"></div>' +
      '<div class="fld"><label>Код</label><input id="oc-code" value="' + esc(t.code) + '"' +
        (code ? ' readonly' : '') + '></div>' +
    '</div>' +
    '<div class="row3" style="grid-template-columns:1fr 1fr 1fr 90px">' +
      '<div class="fld"><label>Единица</label><input id="oc-unit" value="' + esc(t.unit) + '"></div>' +
      '<div class="fld"><label>Лучше</label><select id="oc-dir">' +
        '<option value="max"' + (t.dir === 'max' ? ' selected' : '') + '>больше</option>' +
        '<option value="min"' + (t.dir === 'min' ? ' selected' : '') + '>меньше</option></select></div>' +
      '<div class="fld"><label>Норматив</label><input id="oc-norm" value="' + (t.norm || '') + '"></div>' +
      '<div class="fld"><label>Порядок</label><input id="oc-ord" value="' + (t.ord || '') + '"></div>' +
    '</div>' +
    '<div class="fld"><label>Команды</label><input id="oc-teams" value="' + esc(t.teams) + '"></div>' +
    '<div class="fld"><label>Описание</label><textarea id="oc-note">' + esc(t.note) + '</textarea></div>' +
    '<div class="mact">' +
      '<button class="btn" id="oc-save">Сохранить</button>' +
      '<button class="btn sec" id="oc-back">Назад</button>' +
      '<div class="sp"></div>' +
      (code ? '<button class="del" id="oc-del">Удалить тест</button>' : '') +
    '</div>');

  $('oc-back').onclick = ofCfg;
  var db2 = $('oc-del');
  if (db2) db2.onclick = function(){
    if (!confirm('Удалить тест «' + t.name + '»? Замеры в базе останутся.')) return;
    api({ a:'ofptdel', code: t.code }, function(){ mClose(); ofLoad(1); });
  };
  $('oc-save').onclick = function(){
    var v = function(id){ return ($('oc-' + id).value || '').trim(); };
    if (!v('name')){ alert('Нужно название.'); return; }
    if (!v('code')){ alert('Нужен код.'); return; }
    $('oc-save').textContent = 'Сохраняю…';
    api({ a:'ofptsave', code: v('code'), name: v('name'), unit: v('unit'),
          dir: $('oc-dir').value, norm: v('norm'), note: v('note'),
          teams: v('teams'), ord: v('ord') }, function(res){
      if (!res || !res.ok){ $('oc-save').textContent = 'Не вышло, ещё раз'; return; }
      mClose(); ofLoad(1);
    });
  };
}

/* ── вкладка «План по микроциклам» ── */

function ofPlanDraw(){
  var box = $('of-body');
  if (!MC.list){
    box.innerHTML = '<div class="card"><div class="muted">Загружаю микроциклы…</div></div>';
    api({ a:'pmicro' }, function(res){
      if (!res || !res.ok){
        box.innerHTML = '<div class="card"><div class="muted">Микроциклы не загрузились.</div></div>';
        return;
      }
      MC.list = res.list || []; MC.cur = res.cur || '';
      ofPlanDraw();
    });
    return;
  }
  if (!MC.list.length){
    box.innerHTML = '<div class="card"><div class="muted">Циклов пока нет. ' +
      'Заведи их в разделе «Микроциклы».</div></div>';
    return;
  }

  if (!OF.mc) OF.mc = MC.cur || MC.list[MC.list.length - 1].n;
  var cur = null;
  MC.list.forEach(function(x){ if (x.n === OF.mc) cur = x; });
  if (!cur) cur = MC.list[MC.list.length - 1];

  var bar = MC.list.map(function(x){
    var has = !!String(x.ofp || '').trim();
    return '<button class="mcb' + (x.n === OF.mc ? ' on' : '') + (x.n === MC.cur ? ' cur' : '') +
      '" data-om="' + esc(x.n) + '"' + (has ? '' : ' style="opacity:.55"') + '>' + esc(x.n) + '</button>';
  }).join('');

  var all = MC.list.filter(function(x){ return String(x.ofp || '').trim(); }).length;

  box.innerHTML =
    '<div class="mcbar">' + bar + '</div>' +
    '<div class="card">' +
      '<div class="mchead"><b>Микроцикл ' + esc(cur.n) + '</b><i>' +
        esc(String(cur.dates).replace(/\n/g, ' · ')) + '</i>' +
        (cur.n === MC.cur ? '<u>текущий</u>' : '') + '</div>' +
      (cur.stage ? '<div class="mcstage">' + esc(cur.stage) + '</div>' : '') +
      '<div class="fld" style="margin:10px 0 0"><label>ОФП в этом цикле</label>' +
        '<textarea id="of-mc" style="min-height:200px">' + esc(cur.ofp || '') + '</textarea></div>' +
      '<div class="mact"><button class="btn" id="of-mcsave" style="width:auto;padding:0 22px">Сохранить</button>' +
        '<div class="muted" id="of-mcst" style="margin-left:12px"></div></div>' +
    '</div>' +
    '<div class="card"><h2>Заполнено</h2>' +
      '<div class="muted">ОФП расписан в ' + all + ' циклах из ' + MC.list.length + '. ' +
      'Бледные номера - пустые.</div></div>';

  box.querySelector('.mcbar').onclick = function(e){
    var b = e.target.closest ? e.target.closest('[data-om]') : null;
    if (b){ OF.mc = b.getAttribute('data-om'); ofPlanDraw(); }
  };
  $('of-mcsave').onclick = function(){
    var txt = ($('of-mc').value || '').trim();
    $('of-mcst').textContent = 'Сохраняю…';
    api({ a:'pmicrosave', n: cur.n, dates: cur.dates, from: cur.from, to: cur.to,
          stage: cur.stage, tech: cur.tech, tac: cur.tac, psy: cur.psy, cog: cur.cog,
          theory: cur.theory, extra: cur.extra, ofp: txt }, function(res){
      if (!res || !res.ok){ $('of-mcst').textContent = 'Не вышло, ещё раз'; return; }
      cur.ofp = txt;
      $('of-mcst').textContent = 'Сохранено';
      ofPlanDraw();
    });

var PRE_SRC = { goal:'goal.jpg', rink:'rink.jpg' };

function anBar(id, opts){
  return '<div class="anbar">' +
    '<div class="mcbar" style="margin:0">' +
      [['games','Журнал игр'], ['pre','Предсезонка'], ['seas','Сезон']].map(function(p){
        return '<button class="mcb' + (AN.src === p[0] ? ' on' : '') + '" data-as="' + p[0] + '">' +
          p[1] + '</button>';
      }).join('') +
    '</div>' +
    '<div class="pick"><label>Вратарь</label>' +
      '<select id="' + id + '">' + opts + '</select></div>' +
  '</div>';
}

function preWho(x){
  return x.all.length || x.goal.length || x.rink.length || x.rows.some(function(r){ return r.n; });
}
function preDots(arr){
  return arr.map(function(p){
    return '<b style="left:' + (p.x * 100).toFixed(2) + '%;top:' + (p.y * 100).toFixed(2) +
      '%;background:' + esc(p.c) + '">' + esc(p.n) + '</b>';
  }).join('');
}
function preSum(arr){
  var n = 0;
  arr.forEach(function(p){ if (typeof p.n === 'number') n += p.n; });
  return n;
}

function preDraw(){
  var sec = $('main').querySelector('[data-pg="goals"]');
  var list = PRE[AN.src] || PRE.pre;
  var cur = null;
  list.forEach(function(x){ if (x.name === AN.pgk) cur = x; });
  if (!cur) list.forEach(function(x){ if (!cur && preWho(x)) cur = x; });
  if (!cur) cur = list[0];

  var opts = list.map(function(x){
    return '<option' + (x === cur ? ' selected' : '') + (preWho(x) ? '' : ' data-e="1"') + '>' +
      esc(x.name) + (preWho(x) ? '' : ' — пусто') + '</option>';
  }).join('');

  var sit = (cur.rows || []).map(function(r){
    return '<div' + (r.n ? '' : ' class="z"') + '><i>' + esc(r.t) + '</i><u>' +
      (r.n || '—') + '</u></div>';
  }).join('');

  sec.innerHTML =
    '<div class="head"><h1>Аналитика голов</h1>' +
    '<div class="sub">' + (AN.src === 'seas' ? 'сезон, из разбора игр' : 'предсезонка, из разбора игр') + '</div>' +
    '</div>' +

    anBar('an-pgk', opts) +

    '<div class="kpi">' +
      '<div class="kp"><b>' + preSum(cur.all) + '</b><i>голов всего</i></div>' +
      '<div class="kp"><b>' + preSum(cur.goal) + '</b><i>из них с броска</i></div>' +
      '<div class="kp"><b>' + preSum(cur.rink) + '</b><i>отмечено на площадке</i></div>' +
    '</div>' +

    '<div class="pregrid">' +
      '<div class="card"><h2>Все голы</h2>' +
        (cur.all.length ? '<div class="smap"><img src="' + PRE_SRC.goal + '" alt="">' +
            preDots(cur.all) + '</div>'
                        : '<div class="muted">Отметок нет.</div>') +
      '</div>' +
      '<div class="card"><h2>Голы с броска</h2>' +
        (cur.goal.length ? '<div class="smap"><img src="' + PRE_SRC.goal + '" alt="">' +
            preDots(cur.goal) + '</div>'
                         : '<div class="muted">Отметок нет.</div>') +
      '</div>' +
      '<div class="card"><h2>Откуда бросали</h2>' +
        (cur.rink.length ? '<div class="smap"><img src="' + PRE_SRC.rink + '" alt="">' +
            preDots(cur.rink) + '</div>'
                         : '<div class="muted">Отметок нет.</div>') +
      '</div>' +
      '<div class="card"><h2>Ситуации</h2>' +
        (sit ? '<div class="sit">' + sit + '</div>' : '<div class="muted">Пусто.</div>') +
      '</div>' +
    '</div>';

  $('an-pgk').onchange = function(){ AN.pgk = this.value.replace(/ — пусто$/, ''); preDraw(); };
  sec.querySelector('.mcbar').onclick = function(e){
    var b = e.target.closest ? e.target.closest('[data-as]') : null;
    if (!b) return;
    AN.src = b.getAttribute('data-as');
    if (AN.src === 'games') anLoad(); else preDraw();
  };
}

function skLoad(){
  var sec = $('main').querySelector('[data-pg="skills"]');
  if (GM.list){ skDraw(); return; }
  sec.innerHTML = '<div class="head"><h1>Навыки</h1></div>' +
                  '<div class="card"><div class="muted">Загружаю…</div></div>';
  api({ a:'games2' }, function(res){
    if (!res || !res.ok){
      sec.innerHTML = '<div class="head"><h1>Навыки</h1></div>' +
        '<div class="card"><div class="muted">Не удалось загрузить.</div></div>';
      return;
    }
    GM.list = res.list || []; GM.sit = res.sit || []; GM.sk = res.sk || [];
    skDraw();
  });
}

/** Свод по навыкам: { навык: {n, ok, e} } за набор игр. */
function skSum(games){
  var out = {};
  games.forEach(function(g){
    var sk = g.sk || {};
    for (var nm in sk){
      if (!out[nm]) out[nm] = { n:0, ok:0, e:0 };
      out[nm].n  += Number(sk[nm].n)  || 0;
      out[nm].ok += Number(sk[nm].ok) || 0;
      out[nm].e  += Number(sk[nm].e)  || 0;
    }
  });
  return out;
}
function skPct(x){ return x && x.n ? Math.round(x.ok / x.n * 1000) / 10 : null; }
function skCol(p){
  if (p === null) return '';
  if (p >= 90) return 'var(--ok)';
  if (p >= 75) return 'var(--warn)';
  return 'var(--red)';
}

function skDraw(){
  var sec = $('main').querySelector('[data-pg="skills"]');
  var all = (GM.list || []).filter(function(g){ return g.sk && Object.keys(g.sk).length; });
  var names = {};
  all.forEach(function(g){ if (g.gk) names[g.gk] = 1; });
  var order = (GM.sk && GM.sk.length) ? GM.sk : Object.keys(skSum(all));

  var opts = '<option value="">Все вратари</option>' + Object.keys(names).sort().map(function(x){
    return '<option' + (x === SK.gk ? ' selected' : '') + '>' + esc(x) + '</option>';
  }).join('');

  var mine = SK.gk ? all.filter(function(g){ return g.gk === SK.gk; }) : all;
  var sum = skSum(mine);

  /* сводка по навыкам */
  var tot = { n:0, ok:0, e:0 };
  order.forEach(function(nm){
    var x = sum[nm];
    if (!x) return;
    tot.n += x.n; tot.ok += x.ok; tot.e += x.e;
  });

  var bars = order.map(function(nm){
    var x = sum[nm];
    if (!x || !x.n) return '';
    var p = skPct(x);
    return '<div class="bar" style="grid-template-columns:minmax(120px,180px) 1fr 160px">' +
      '<div class="nm">' + esc(nm) + '</div>' +
      '<div class="ln"><u style="width:' + p + '%;background:' + skCol(p) + '"></u></div>' +
      '<div class="vl"><b>' + p + '%</b> · ' + x.ok + '/' + x.n +
        (x.e ? ' · ош. ' + x.e : '') + '</div></div>';
  }).join('');

  /* таблица вратарь × навык */
  var gks = Object.keys(names).sort();
  var head = '<tr><th>Навык</th>' + gks.map(function(n){
    return '<th class="num">' + esc(n.split(' ')[0]) + '</th>'; }).join('') +
    '<th class="num">Всего</th></tr>';
  var byGk = {};
  gks.forEach(function(n){
    byGk[n] = skSum(all.filter(function(g){ return g.gk === n; }));
  });
  var grid = order.map(function(nm){
    var line = gks.map(function(n){
      var x = byGk[n][nm], p = skPct(x);
      return '<td class="num"' + (p === null ? ' class="muted"' : ' style="color:' + skCol(p) + '"') + '>' +
        (p === null ? '—' : p + '%<span style="color:var(--tx2);font-size:11.5px"> ' + x.n + '</span>') + '</td>';
    }).join('');
    var a = skSum(all)[nm], ap = skPct(a);
    if (!a) return '';
    return '<tr><td class="gk">' + esc(nm) + '</td>' + line +
      '<td class="num"><b>' + (ap === null ? '—' : ap + '%') + '</b></td></tr>';
  }).join('');

  /* по играм выбранного вратаря */
  var byGame = '';
  if (SK.gk){
    var rows = mine.slice().sort(function(a, b){ return a.d < b.d ? 1 : -1; }).map(function(g){
      var s = skSum([g]), n = 0, ok = 0;
      for (var k in s){ n += s[k].n; ok += s[k].ok; }
      var p = n ? Math.round(ok / n * 1000) / 10 : null;
      var weak = '';
      var worst = null;
      for (var k2 in s){
        var pp = skPct(s[k2]);
        if (pp !== null && s[k2].n >= 2 && (worst === null || pp < worst.p)) worst = { nm:k2, p:pp, n:s[k2].n };
      }
      if (worst && worst.p < 100) weak = worst.nm + ' ' + worst.p + '%';
      return '<tr><td class="num">' + dsh(g.d) + '</td><td>' + esc(g.opp) + '</td>' +
        '<td class="num">' + n + '</td><td class="num">' + ok + '</td>' +
        '<td class="num"' + (p === null ? '' : ' style="color:' + skCol(p) + '"') + '><b>' +
          (p === null ? '—' : p + '%') + '</b></td>' +
        '<td class="muted">' + esc(weak) + '</td></tr>';
    }).join('');
    byGame = '<div class="card"><h2>По играм · ' + esc(SK.gk) + '</h2>' +
      '<table class="tbl"><thead><tr><th class="num">Дата</th><th>Соперник</th>' +
      '<th class="num">Всего</th><th class="num">Удачно</th><th class="num">%</th>' +
      '<th>Слабее всего</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
  }

  sec.innerHTML =
    '<div class="head"><h1>Навыки</h1>' +
    '<div class="sub">считается из карточек игр</div></div>' +

    '<div class="anbar">' +
      '<div class="pick"><label>Вратарь</label><select id="sk-gk">' + opts + '</select></div>' +
    '</div>' +

    '<div class="kpi">' +
      '<div class="kp"><b>' + mine.length + '</b><i>игр с разбором</i></div>' +
      '<div class="kp"><b>' + tot.n + '</b><i>эпизодов</i></div>' +
      '<div class="kp"><b>' + (tot.n ? Math.round(tot.ok / tot.n * 1000) / 10 + '%' : '—') +
        '</b><i>успешно</i></div>' +
      '<div class="kp"><b>' + tot.e + '</b><i>ошибок</i></div>' +
    '</div>' +

    '<div class="card"><h2>По навыкам' + (SK.gk ? ' · ' + esc(SK.gk) : '') + '</h2>' +
      (bars ? '<div class="bars">' + bars + '</div>'
            : '<div class="muted">Разборов пока нет. Заполняй навыки в карточке игры.</div>') +
      '<div class="ice">зелёный от 90% · жёлтый от 75% · красный ниже</div></div>' +

    (grid ? '<div class="card"><h2>Вратари рядом</h2><table class="tbl"><thead>' + head +
      '</thead><tbody>' + grid + '</tbody></table>' +
      '<div class="ice">процент успеха, рядом серым — сколько эпизодов</div></div>' : '') +

    byGame;

  $('sk-gk').onchange = function(){ SK.gk = this.value; skDraw(); };
}

/* ───────── запуск ───────── */
function start(){
  showGate(false);
  $('me-name').textContent = ME.name || 'Тренер';
  go('sched');
}

function boot(){
  $('g-in').onclick = gateIn;
  $('g-code').onkeydown = function(e){ if (e.key === 'Enter') gateIn(); };
  $('me-out').onclick = gateOut;
  $('thm').onclick = function(){ applyTheme(document.body.className !== 'dk'); };
  initTheme();
  try { foldInit(); } catch(e){}
  $('w-prev').onclick = function(){ SCH.mon = shift(SCH.mon, -7); schLoad(); };
  $('w-next').onclick = function(){ SCH.mon = shift(SCH.mon,  7); schLoad(); };
  $('w-now').onclick  = function(){ SCH.mon = monday(TODAY);      schLoad(); };
  $('sch-pull').onclick = function(){
    if (!confirm('Перечитать планер из Google-таблицы?\n\n' +
      'Расписание в приложении будет заменено тем, что в таблице. ' +
      'Правки, сделанные здесь и не перенесённые в таблицу, пропадут. ' +
      'Микроциклы не затрагиваются.')) return;
    var b = $('sch-pull'); b.textContent = 'Читаю таблицу…';
    api({ a:'pimport' }, function(res){
      if (!res || !res.ok){ b.textContent = 'Не вышло, ещё раз'; return; }
      b.textContent = 'Готово: дней ' + res.days;
      SCH.cache = {}; schLoad();
      setTimeout(function(){ b.textContent = 'Подтянуть из таблицы'; }, 4000);
    });
  };
  $('sch-copy').onclick = function(){
    if (!confirm('Скопировать эту неделю на следующую? Записи следующей недели будут заменены.')) return;
    api({ a:'pweekcopy', from: SCH.mon, to: shift(SCH.mon, 7) }, function(res){
      if (!res || !res.ok){ alert('Не получилось скопировать.'); return; }
      SCH.cache = {}; SCH.mon = shift(SCH.mon, 7); schLoad();
    });
  };
  var nav = $('nav');
  nav.onclick = function(e){
    var b = e.target.closest ? e.target.closest('button[data-p]') : null;
    if (b) go(b.getAttribute('data-p'));
  };

  if (!KEY){ showGate(true); $('g-code').focus(); return; }
  /* ключ есть — проверяем, что он тренерский */
  /* roster отдаётся только тренеру — заодно проверка доступа */
  api({ a:'roster' }, function(res){
    if (!res || !res.ok){
      showGate(true);
      if (res && res.err === 'forbidden') $('g-err').textContent = 'Этот вход не тренерский.';
      return;
    }
    ME.coach = true;
    ROSTER = res.list || [];
    start();
  });
}
boot();
</script>
