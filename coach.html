<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет тренера · Спартак-МАХ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f5f7; --bg2:#ffffff; --bg3:#eceef1; --card:#ffffff;
    --line:#dfe3e8; --tx:#141720; --tx2:#596073; --w:#0b0d12;
    --red:#d6112e; --roseBg:#fdeef0; --roseLn:#f3c6ce;
    --ok:#1f9d4d; --warn:#b26a00;
    --mah:#ffd966; --mhk:#f0a9a9; --u17:#a8c9ec; --y10:#bcdcae;
    --shadow:0 1px 2px rgba(16,20,30,.06), 0 1px 1px rgba(16,20,30,.04);
  }
  body.dk{
    --bg:#0e0f14; --bg2:#15171e; --bg3:#1e212a; --card:#15171e;
    --line:#282c36; --tx:#e7e9ef; --tx2:#9aa1b1; --w:#ffffff;
    --red:#ff3650; --roseBg:#2b1218; --roseLn:#5c2029;
    --ok:#46c06a; --warn:#e0a33a;
    --mah:#d8b24e; --mhk:#c87f7f; --u17:#7fa6cd; --y10:#8fb880;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }
  body.dk .g{color:#10121a}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--tx);
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Roboto,'Helvetica Neue',Arial,sans-serif;
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  .ttf{font-family:'Unbounded',-apple-system,BlinkMacSystemFont,sans-serif}

  /* ── вход ── */
  .gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        background:var(--bg);z-index:50}
  .gate.hide{display:none}
  .gbox{width:340px;max-width:92vw;background:var(--card);border:1px solid var(--line);
        border-radius:18px;padding:26px 24px;box-shadow:0 8px 28px rgba(16,20,30,.10)}
  .gbox h1{font-family:'Unbounded',sans-serif;font-size:19px;font-weight:800;margin:0 0 6px}
  .gbox p{font-size:14px;color:var(--tx2);margin:0 0 18px;line-height:1.55}
  .gbox input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);
        background:var(--bg3);color:var(--w);font-family:inherit;font-size:19px;font-weight:700;
        text-align:center;letter-spacing:3px;text-transform:uppercase;outline:none}
  .gbox input:focus{border-color:var(--red)}
  .gerr{font-size:12.5px;color:var(--red);margin-top:10px;min-height:18px}

  .btn{display:block;width:100%;height:46px;border-radius:12px;border:none;cursor:pointer;
       background:var(--red);color:#fff;font-size:15px;font-weight:700;margin-top:14px}
  .btn:active{opacity:.85}
  .btn.sec{background:var(--bg2);color:var(--tx);border:1px solid var(--line);box-shadow:var(--shadow)}
  .btn.sec:hover{background:var(--bg3)}
  .btn.sm{height:38px;font-size:13.5px;font-weight:600;width:auto;padding:0 16px;margin:0;display:inline-block}

  /* ── каркас ── */
  .app{display:flex;min-height:100vh}
  .app.hide{display:none}
  .side{width:236px;flex:none;background:var(--bg2);border-right:1px solid var(--line);
        display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .logo{padding:20px 18px 14px;border-bottom:1px solid var(--line)}
  .logo b{display:block;font-family:'Unbounded',sans-serif;font-size:15px;font-weight:800;letter-spacing:.2px}
  .logo i{display:block;font-size:12.5px;color:var(--tx2);font-style:normal;margin-top:4px}
  .nav{flex:1;padding:10px 10px;overflow:auto}
  .nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
        background:none;border:none;color:#3f4555;font-size:14.5px;font-weight:500;padding:10px 12px;
        border-radius:10px;cursor:pointer;margin-bottom:2px}
  .nav button:hover{background:var(--bg3);color:var(--tx)}
  .nav button.on em{filter:none}
  .nav button.on{background:var(--roseBg);color:var(--w);font-weight:700}
  .nav button em{font-style:normal;width:20px;text-align:center;flex:none;font-size:15px}
  .nav .gr{font-size:11px;color:#858d9c;text-transform:uppercase;letter-spacing:.9px;
        padding:15px 12px 6px;font-weight:700}
  .me{padding:13px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--tx2);
      display:flex;align-items:center;gap:8px}
  .me b{color:var(--tx);font-weight:600;font-size:13.5px}
  .thm{margin-left:auto;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);
       background:var(--bg3);color:var(--tx);font-size:14px;line-height:1;cursor:pointer;
       display:flex;align-items:center;justify-content:center}
  .thm:hover{border-color:var(--red)}
  .me a{margin-left:10px;color:var(--tx2);text-decoration:none;cursor:pointer;font-size:12.5px}
  .me a:hover{color:var(--red)}

  .main{flex:1;min-width:0;padding:26px 32px 60px}
  .head{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
  .head h1{font-family:'Unbounded',sans-serif;font-size:23px;font-weight:800;margin:0;letter-spacing:-.2px}
  .head .sub{font-size:13.5px;color:var(--tx2);padding-bottom:3px}
  .head .sp{flex:1}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .card h2{font-family:'Unbounded',sans-serif;font-size:15px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .card h2:before{content:'';width:3px;height:14px;background:var(--red);border-radius:2px}
  .muted{color:var(--tx2);font-size:14px}

  /* ── расписание ── */
  .wnav{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .wnav .ttl{font-family:'Unbounded',sans-serif;font-size:16px;font-weight:700;min-width:230px}
  .arr{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);
       color:var(--w);font-size:19px;line-height:1;cursor:pointer;box-shadow:var(--shadow)}
  .arr:hover{background:var(--bg3)}

  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
  .day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 12px;
       min-height:180px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
  .day.now{border-color:var(--red);box-shadow:0 0 0 1px var(--red), var(--shadow)}
  .day.off{background:var(--bg3)}
  .day .dt{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:700;margin-bottom:3px}
  .day .wd{font-size:11.5px;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px;
       margin-bottom:10px;font-weight:600}
  .day.now .wd{color:var(--red)}
  .g{border-radius:9px;padding:8px 9px;margin-bottom:7px;font-size:12.5px;line-height:1.4;color:#14161c}
  .g span{opacity:.72}
  .g b{display:block;font-weight:700;font-size:13.5px;margin-bottom:1px}
  .g span{opacity:.75}
  .g.mah{background:var(--mah)} .g.mhk{background:var(--mhk)}
  .g.u17{background:var(--u17)} .g.y10{background:var(--y10)}
  .it{font-size:13px;line-height:1.5;margin-bottom:9px;color:var(--tx)}
  .it .lb{display:block;font-size:10.5px;color:#8a91a0;text-transform:uppercase;font-weight:600;
       letter-spacing:.6px;margin-bottom:2px}
  .it.trip{color:#9a5b00}
  .it.off{color:var(--tx2)}
  .dash{color:#c3c8d0;font-size:12px;margin-top:auto;text-align:center;padding-top:10px}

  /* игры */
  .tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl th{text-align:left;font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;
       letter-spacing:.5px;padding:0 10px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
  .tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tbody tr{cursor:pointer}
  .tbl tbody tr:hover{background:var(--bg3)}
  .tbl .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .tbl .gk{font-weight:600}
  .wl{display:inline-block;min-width:22px;text-align:center;font-weight:700;font-size:12px;
      padding:2px 6px;border-radius:6px}
  .wl.w{background:#e6f5ea;color:#1f7a3d}
  .wl.l{background:#fdeaea;color:#b4232d}
  body.dk .wl.w{background:#16351f;color:#6ad08a}
  body.dk .wl.l{background:#3a1419;color:#f08b8b}
  .ld{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:6px;
      font-weight:700;font-size:11.5px}
  .ld.H{background:#fdeaea;color:#b4232d} .ld.S{background:#e6f5ea;color:#1f7a3d}
  .ld.O{background:#eef1f5;color:#5b6474} .ld.B{background:#3a1419;color:#fff}
  body.dk .ld.H{background:#3a1419;color:#f08b8b} body.dk .ld.S{background:#16351f;color:#6ad08a}
  body.dk .ld.O{background:#262a33;color:#aeb6c4}
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
  .kp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
      box-shadow:var(--shadow)}
  .kp b{display:block;font-family:'Unbounded',sans-serif;font-size:22px;font-weight:800;line-height:1.1}
  .kp i{display:block;font-style:normal;font-size:12px;color:var(--tx2);margin-top:4px}
  .gl{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .gl select{flex:1}
  .gl .z{width:62px;flex:none}
  .net{display:grid;grid-template-columns:repeat(3,44px);gap:4px;margin-top:4px}
  .net button{height:36px;border:1px solid var(--line);background:var(--bg3);border-radius:7px;
      cursor:pointer;font-size:12px;color:var(--tx2)}
  .net button.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
  /* аналитика голов */
  .anwrap{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
  @media (max-width:900px){ .anwrap{grid-template-columns:1fr} }
  .goal{background:var(--bg3);border:2px solid var(--line);border-radius:10px;padding:10px;
        display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .goal .z{height:62px;border-radius:8px;display:flex;flex-direction:column;align-items:center;
       justify-content:center;background:var(--bg2);border:1px solid var(--line)}
  .goal .z b{font-family:'Unbounded',sans-serif;font-size:19px;font-weight:800;line-height:1}
  .goal .z i{font-style:normal;font-size:10.5px;color:var(--tx2);margin-top:3px}
  .goal .z.hot{color:#fff;border-color:transparent}
  .ice{font-size:11.5px;color:var(--tx2);text-align:center;margin-top:8px}
  .bars{display:flex;flex-direction:column;gap:9px}
  .bar{display:grid;grid-template-columns:150px 1fr 74px;gap:10px;align-items:center;font-size:13.5px}
  .bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .ln{height:22px;background:var(--bg3);border-radius:6px;overflow:hidden}
  .bar .ln u{display:block;height:100%;background:var(--red);border-radius:6px}
  .bar .vl{text-align:right;color:var(--tx2);font-size:12.5px;white-space:nowrap}
  .bar .vl b{color:var(--tx);font-size:13.5px}
  .dets{font-size:12.5px;color:var(--tx2);margin-top:6px;line-height:1.5}
  .zpick{display:grid;grid-template-columns:repeat(3,38px);gap:4px}
  .zpick button{height:32px;border:1px solid var(--line);background:var(--bg3);border-radius:6px;
       cursor:pointer;font-size:11.5px;color:var(--tx2)}
  .zpick button.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
  /* редактирование */
  .modal{position:fixed;inset:0;background:rgba(10,12,18,.55);z-index:60;display:flex;
         align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
  .modal.hide{display:none}
  .mbox{width:640px;max-width:100%;background:var(--bg2);border:1px solid var(--line);
        border-radius:16px;padding:22px 24px;box-shadow:0 20px 60px rgba(10,14,25,.25)}
  .mbox h2{font-family:'Unbounded',sans-serif;font-size:17px;font-weight:800;margin:0 0 4px}
  .mbox .ms{font-size:13.5px;color:var(--tx2);margin-bottom:18px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:12.5px;font-weight:600;color:var(--tx2);margin-bottom:5px}
  .fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);border-radius:10px;
        background:var(--bg3);color:var(--tx);font-family:inherit;font-size:14px;padding:10px 12px;
        outline:none;resize:vertical}
  .fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--red);background:var(--bg2)}
  .fld textarea{min-height:92px;line-height:1.5}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:120px 1fr 110px;gap:10px;align-items:end;margin-bottom:10px}
  .mact{display:flex;gap:10px;margin-top:20px;align-items:center}
  .mact .sp{flex:1}
  .mact .btn{margin:0;width:auto;padding:0 20px}
  .del{background:none;border:none;color:var(--tx2);font-size:13px;cursor:pointer;padding:6px}
  .del:hover{color:var(--red)}
  .itrow{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
  .itrow select{width:118px;flex:none}
  .itrow textarea{min-height:40px}
  .itrow .x{width:34px;height:38px;flex:none;border:1px solid var(--line);border-radius:9px;
       background:var(--bg3);color:var(--tx2);cursor:pointer;font-size:16px}
  .itrow .x:hover{color:var(--red);border-color:var(--red)}
  .day{cursor:pointer;transition:border-color .12s}
  .day:hover{border-color:var(--red)}
  .addbtn{width:100%;border:1px dashed var(--line);background:none;color:var(--tx2);
       border-radius:10px;padding:9px;font-size:13px;cursor:pointer;font-family:inherit}
  .addbtn:hover{border-color:var(--red);color:var(--red)}
  /* микроциклы */
  .mcbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
  .mcb{min-width:40px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);
       background:var(--bg2);color:var(--tx);font-size:14px;font-weight:600;cursor:pointer;
       box-shadow:var(--shadow)}
  .mcb:hover{border-color:var(--red)}
  .mcb.on{background:var(--red);border-color:var(--red);color:#fff}
  .mcb.cur{border-color:var(--red);color:var(--red)}
  .mcb.cur.on{color:#fff}
  .mchead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  .mchead b{font-family:'Unbounded',sans-serif;font-size:19px;font-weight:800}
  .mchead i{font-style:normal;font-size:14px;color:var(--tx2)}
  .mchead u{text-decoration:none;font-size:11.5px;font-weight:700;color:#fff;background:var(--red);
       padding:3px 9px;border-radius:7px;letter-spacing:.3px}
  .mcstage{font-size:14px;color:var(--tx);margin-bottom:18px;white-space:pre-line;line-height:1.5}
  .mcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  .mcbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
       box-shadow:var(--shadow)}
  .mcbox h3{font-family:'Unbounded',sans-serif;font-size:13.5px;font-weight:700;margin:0 0 10px;
       display:flex;align-items:center;gap:7px;color:var(--tx)}
  .mcbox h3:before{content:'';width:3px;height:13px;border-radius:2px;background:var(--red)}
  .mcbox .tx{font-size:14px;line-height:1.6;white-space:pre-line;color:var(--tx)}
  .mcbox.empty .tx{color:var(--tx2)}
  .soon{padding:44px 0;text-align:center;color:var(--tx2);font-size:14.5px;line-height:1.6}
  .soon b{display:block;font-family:'Unbounded',sans-serif;color:var(--tx);font-size:16px;margin-bottom:8px}

  @media (max-width:1100px){
    .week{grid-template-columns:repeat(2,minmax(0,1fr))}
    .main{padding:20px}
  }
  @media (max-width:760px){
    .app{flex-direction:column}
    .side{width:100%;height:auto;position:static;flex-direction:row;overflow:auto}
    .logo{border-bottom:none;border-right:1px solid var(--line)}
    .nav{display:flex;gap:4px;padding:10px}
    .nav .gr,.me{display:none}
    .nav button{white-space:nowrap}
    .week{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- ── вход ── -->
<div class="gate" id="gate">
  <div class="gbox">
    <h1>Кабинет тренера</h1>
    <p>Введи код доступа. Он выдаётся один раз — дальше браузер помнит вход.</p>
    <input id="g-code" maxlength="8" autocomplete="off" placeholder="КОД">
    <div class="gerr" id="g-err"></div>
    <button class="btn" id="g-in">Войти</button>
  </div>
</div>

<!-- ── рабочее место ── -->
<div class="app hide" id="app">
  <aside class="side">
    <div class="logo">
      <b>Спартак-МАХ</b>
      <i>вратарская система</i>
    </div>
    <nav class="nav" id="nav">
      <div class="gr">Работа</div>
      <button data-p="sched" class="on"><em>📅</em>Расписание</button>
      <button data-p="micro"><em>🧩</em>Микроциклы</button>
      <button data-p="games"><em>🏒</em>Игры</button>
      <button data-p="goals"><em>🥅</em>Аналитика голов</button>
      <div class="gr">Вратари</div>
      <button data-p="roster"><em>🧤</em>Все вратари</button>
      <button data-p="rates"><em>📊</em>Оценки</button>
      <button data-p="cog"><em>🧠</em>Когнитивка</button>
      <button data-p="ofp"><em>💪</em>ОФП</button>
      <div class="gr">Материалы</div>
      <button data-p="theory"><em>📚</em>Теория</button>
      <button data-p="psy"><em>🧩</em>Психология</button>
    </nav>
    <div class="me">
      <b id="me-name">—</b>
      <button class="thm" id="thm" type="button" title="Светлая или тёмная тема">🌙</button>
      <a id="me-out">выйти</a>
    </div>
  </aside>

  <main class="main" id="main">
    <!-- расписание -->
    <section data-pg="sched">
      <div class="head">
        <h1>Расписание</h1>
        <div class="sub">нажми на день, чтобы изменить</div>
        <div class="sp"></div>
        <button class="btn sec sm" id="sch-copy">Скопировать неделю вперёд</button>
      </div>
      <div class="wnav">
        <button class="arr" id="w-prev">‹</button>
        <div class="ttl" id="w-ttl">—</div>
        <button class="arr" id="w-next">›</button>
        <button class="btn sec sm" id="w-now">Текущая неделя</button>
      </div>
      <div class="week" id="week"></div>
    </section>

    <section data-pg="micro" class="hide"></section>
    <section data-pg="games" class="hide"></section>
    <section data-pg="goals" class="hide"></section>
    <section data-pg="roster" class="hide"></section>
    <section data-pg="rates" class="hide"></section>
    <section data-pg="cog" class="hide"></section>
    <section data-pg="ofp" class="hide"></section>
    <section data-pg="theory" class="hide"></section>
    <section data-pg="psy" class="hide"></section>
  </main>
</div>

<div class="modal hide" id="modal">
  <div class="mbox" id="mbody"></div>
</div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbySUUoLkv6qaywWfDZ9Qn1fob2Z2o4Md7npra59c_F24DreU8iSc9tzdsoedyC_6-tM/exec';

var KEY = '';
try { KEY = localStorage.getItem('gk_site_key') || ''; } catch(e){}
var ME = { name: '', coach: false };
var ROSTER = [];

function $(id){ return document.getElementById(id); }

/* ── тема ── */
function applyTheme(dark){
  document.body.className = dark ? 'dk' : '';
  var b = $('thm');
  if (b) b.textContent = dark ? '☀️' : '🌙';
  try { localStorage.setItem('coach_theme', dark ? 'dk' : 'lt'); } catch(e){}
}
function initTheme(){
  var v = '';
  try { v = localStorage.getItem('coach_theme') || ''; } catch(e){}
  if (!v) v = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dk' : 'lt';
  applyTheme(v === 'dk');
}
function esc(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function api(payload, cb){
  payload.sk = KEY;
  var done = false;
  var t = setTimeout(function(){ if(!done){ done = true; cb(null); } }, 20000);
  fetch(API_URL, { method:'POST', body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); })
    .then(function(j){ if(done) return; done = true; clearTimeout(t); cb(j); })
    .catch(function(){ if(done) return; done = true; clearTimeout(t); cb(null); });
}

/* ───────── вход ───────── */
function showGate(on){
  $('gate').className = on ? 'gate' : 'gate hide';
  $('app').className  = on ? 'app hide' : 'app';
}
function gateIn(){
  var code = ($('g-code').value || '').trim().toUpperCase();
  if (code.length < 4){ $('g-err').textContent = 'Код короткий.'; return; }
  $('g-err').textContent = 'Проверяю…';
  fetch(API_URL, { method:'POST', body: JSON.stringify({ a:'login', code: code }) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if (!res || !res.ok){ $('g-err').textContent = (res && res.err) || 'Не получилось.'; return; }
      if (!res.isCoach){ $('g-err').textContent = 'Этот код не тренерский. Вратарям — основное приложение.'; return; }
      KEY = res.key;
      try { localStorage.setItem('gk_site_key', KEY); } catch(e){}
      ME.name = res.name || ''; ME.coach = true;
      start();
    })
    .catch(function(){ $('g-err').textContent = 'Нет связи.'; });
}
function gateOut(){
  try { localStorage.removeItem('gk_site_key'); } catch(e){}
  KEY = ''; location.reload();
}

/* ───────── навигация ───────── */
var PAGE = 'sched';
function go(p){
  PAGE = p;
  var btns = $('nav').querySelectorAll('button');
  for (var i = 0; i < btns.length; i++)
    btns[i].className = (btns[i].getAttribute('data-p') === p) ? 'on' : '';
  var secs = $('main').querySelectorAll('section');
  for (var j = 0; j < secs.length; j++)
    secs[j].className = (secs[j].getAttribute('data-pg') === p) ? '' : 'hide';
  if (p === 'sched') schLoad();
  else if (p === 'micro') mcLoad();
  else if (p === 'games') gmLoad();
  else if (p === 'goals') anLoad();
  else drawSoon(p);
}

  rates:  ['Оценки', 'Оценка вратаря по разделам, сравнение самооценки и оценки тренера, динамика по месяцам.'],
  cog:    ['Когнитивка', 'Результаты Шульте, «Светофона», Струпа, слежения и реакции с помехами.'],

  psy:    ['Психология', 'Материалы и план работы по психологической подготовке.']

function drawSoon(p){

                  '<div class="card"><div class="soon"><b>Раздел в работе</b>' + esc(s[1]) + '</div></div>';

/* ───────── расписание ───────── */
var WD = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];
var MN = ['января','февраля','марта','апреля','мая','июня',
          'июля','августа','сентября','октября','ноября','декабря'];
var SCH = { mon:null, cache:{} };
var TODAY = fmt(new Date());

function fmt(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function shift(iso, n){ var d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return fmt(d); }
function monday(iso){ var d = new Date(iso+'T00:00:00'); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return fmt(d); }
function human(iso){ var d = new Date(iso+'T00:00:00'); return d.getDate()+' '+MN[d.getMonth()]; }

function schLoad(fresh){
  if (!SCH.mon) SCH.mon = monday(TODAY);
  var from = SCH.mon, to = shift(from, 6);
  $('w-ttl').textContent = human(from) + ' — ' + human(to);

  if (!fresh && SCH.cache[from]){ schDraw(SCH.cache[from]); return; }
  $('week').innerHTML = '<div class="muted">Загружаю…</div>';
  var q = { a:'pdays', from: from, to: to };
  if (fresh) q.fresh = 1;
  api(q, function(res){
    if (!res || !res.ok){
      $('week').innerHTML = '<div class="muted">' +
        ((res && res.err === 'forbidden') ? 'Нет доступа: нужен тренерский код.' : 'Не удалось загрузить.') +
        '</div>';
      return;
    }
    SCH.cache[from] = res.days || [];
    schDraw(SCH.cache[from]);
  });
}

var TEAMCL = { 'МАХ':'mah', 'МХК':'mhk', 'Юниоры':'u17', '2010':'y10' };
function schDraw(days){
  var map = {};
  (days||[]).forEach(function(d){ map[d.d] = d.it || []; });

  var html = '';
  for (var i = 0; i < 7; i++){
    var iso = shift(SCH.mon, i), it = map[iso] || [];
    var isOff = it.some(function(x){ return x.k === 'off'; });
    html += '<div class="day' + (iso === TODAY ? ' now' : '') + (isOff ? ' off' : '') +
            '" data-day="' + iso + '">' +
            '<div class="dt">' + human(iso) + '</div><div class="wd">' + WD[i] + '</div>';

    it.filter(function(x){ return x.k === 'game'; }).forEach(function(g){
      html += '<div class="g ' + (TEAMCL[g.team] || 'mah') + '"><b>' + esc(g.opp) + '</b>' +
              '<span>' + esc(g.team) + ' · ' + (g.home ? 'дома' : 'выезд') + '</span></div>';
    });
    it.filter(function(x){ return x.k !== 'game'; }).forEach(function(x){
      var lb = x.k === 'who' ? 'состав' : x.k === 'plan' ? 'время'
             : x.k === 'trip' ? 'дорога' : x.k === 'off' ? '' : 'заметка';
      html += '<div class="it ' + x.k + '">' + (lb ? '<span class="lb">' + lb + '</span>' : '') +
              esc(x.t).replace(/\n/g, '<br>') + '</div>';
    });
    if (!it.length) html += '<div class="dash">—</div>';
    html += '</div>';
  }
  $('week').innerHTML = html;
  $('week').onclick = function(e){
    var el = e.target.closest ? e.target.closest('[data-day]') : null;
    if (el) dayEdit(el.getAttribute('data-day'), map[el.getAttribute('data-day')] || []);
  };
}

/* ───────── микроциклы ───────── */
var MC = { list: null, cur: '', sel: '' };

function mcLoad(fresh){
  var sec = $('main').querySelector('[data-pg="micro"]');
  if (MC.list && !fresh){ mcDraw(); return; }
  sec.innerHTML = '<div class="head"><h1>Микроциклы</h1></div><div class="card"><div class="muted">Загружаю…</div></div>';
  var q = { a:'pmicro' };
  if (fresh) q.fresh = 1;
  api(q, function(res){
    if (!res || !res.ok){
      sec.innerHTML = '<div class="head"><h1>Микроциклы</h1></div>' +
        '<div class="card"><div class="muted">Не удалось загрузить. Попробуй ещё раз.</div></div>';
      return;
    }
    MC.list = res.list || [];
    MC.cur  = res.cur || '';
    if (!MC.sel) MC.sel = MC.cur || (MC.list.length ? MC.list[MC.list.length-1].n : '');
    mcDraw();
  });
}

function mcDraw(){
  var sec = $('main').querySelector('[data-pg="micro"]');
  if (!MC.list || !MC.list.length){
    sec.innerHTML = '<div class="head"><h1>Микроциклы</h1></div>' +
      '<div class="card"><div class="muted">В таблице пока нет заполненных циклов.</div></div>';
    return;
  }
  var cur = null;
  MC.list.forEach(function(x){ if (x.n === MC.sel) cur = x; });
  if (!cur) cur = MC.list[MC.list.length-1];

  var bar = MC.list.map(function(x){
    var cl = 'mcb' + (x.n === MC.sel ? ' on' : '') + (x.n === MC.cur ? ' cur' : '');
    return '<button class="' + cl + '" data-mc="' + esc(x.n) + '">' + esc(x.n) + '</button>';
  }).join('');

  var boxes = [
    ['Техника · лёд',   cur.tech],
    ['Тактика · лёд',   cur.tac],
    ['Психология',      cur.psy],
    ['Когнитивка',      cur.cog],
    ['Теория',          cur.theory],
    ['Дополнительно',   cur.extra]
  ].map(function(b){
    var has = !!String(b[1] || '').trim();
    return '<div class="mcbox' + (has ? '' : ' empty') + '"><h3>' + b[0] + '</h3>' +
           '<div class="tx">' + (has ? esc(b[1]) : '—') + '</div></div>';
  }).join('');

  sec.innerHTML =
    '<div class="head"><h1>Микроциклы</h1>' +
    '<div class="sub">план на цикл: техника, тактика, психология, когнитивка, теория</div>' +
    '<div class="sp"></div>' +
    '<button class="btn sec sm" id="mc-new">+ Новый цикл</button>' +
    '<button class="btn sec sm" id="mc-edit" style="margin-left:8px">Править этот</button></div>' +
    '<div class="mcbar">' + bar + '</div>' +
    '<div class="card">' +
      '<div class="mchead"><b>Микроцикл ' + esc(cur.n) + '</b><i>' +
        esc(String(cur.dates).replace(/\n/g, ' · ')) + '</i>' +
        (cur.n === MC.cur ? '<u>текущий</u>' : '') + '</div>' +
      (cur.stage ? '<div class="mcstage">' + esc(cur.stage) + '</div>' : '') +
      '<div class="mcgrid">' + boxes + '</div>' +
    '</div>';

  sec.querySelector('.mcbar').onclick = function(e){
    var b = e.target.closest ? e.target.closest('button[data-mc]') : null;
    if (!b) return;
    MC.sel = b.getAttribute('data-mc');
    mcDraw();
  };
  var nb = $('mc-new');  if (nb) nb.onclick = function(){ mcEdit(''); };
  var eb = $('mc-edit'); if (eb) eb.onclick = function(){ mcEdit(cur.n); };
}

function mOpen(html){ $('mbody').innerHTML = html; $('modal').className = 'modal'; }
function mClose(){ $('modal').className = 'modal hide'; $('mbody').innerHTML = ''; }

/* ───────── редактор дня ───────── */
var KINDS = [['plan','время'], ['who','состав'], ['note','заметка'],
             ['trip','дорога'], ['off','выходной']];
var TEAMS = ['МАХ', 'МХК', 'Юниоры', '2010'];
var DAY = { d:'', it:[] };

function dayEdit(iso, items){
  DAY.d = iso;
  DAY.it = JSON.parse(JSON.stringify(items || []));
  dayForm();
}

function dayForm(){
  var games = DAY.it.filter(function(x){ return x.k === 'game'; });
  var rest  = DAY.it.filter(function(x){ return x.k !== 'game'; });

  var gh = games.map(function(g, i){
    return '<div class="row3" data-g="' + i + '">' +
      '<div class="fld" style="margin:0"><label>Команда</label><select data-gf="team">' +
        TEAMS.map(function(t){ return '<option' + (t === g.team ? ' selected' : '') + '>' + t + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="fld" style="margin:0"><label>Соперник</label>' +
        '<input data-gf="opp" value="' + esc(g.opp) + '"></div>' +
      '<div class="fld" style="margin:0"><label>Где</label><select data-gf="home">' +
        '<option value="1"' + (g.home ? ' selected' : '') + '>Дома</option>' +
        '<option value="0"' + (g.home ? '' : ' selected') + '>Выезд</option>' +
      '</select></div></div>';
  }).join('');

  var rh = rest.map(function(x, i){
    return '<div class="itrow" data-r="' + i + '">' +
      '<select data-rf="k">' + KINDS.map(function(k){
        return '<option value="' + k[0] + '"' + (k[0] === x.k ? ' selected' : '') + '>' + k[1] + '</option>';
      }).join('') + '</select>' +
      '<textarea data-rf="t">' + esc(x.t || '') + '</textarea>' +
      '<button class="x" data-del="' + i + '">×</button></div>';
  }).join('');

  mOpen(
    '<h2>' + human(DAY.d) + '</h2>' +
    '<div class="ms">' + WD[(new Date(DAY.d + "T00:00:00").getDay() + 6) % 7] + '</div>' +
    '<div class="fld"><label>Игры</label>' + (gh || '<div class="muted" style="margin-bottom:8px">Игр нет</div>') +
      '<button class="addbtn" id="add-game">+ добавить игру</button></div>' +
    '<div class="fld"><label>Занятие и заметки</label>' + rh +
      '<button class="addbtn" id="add-row">+ добавить строку</button></div>' +
    '<div class="mact">' +
      '<button class="btn" id="day-save">Сохранить</button>' +
      '<button class="btn sec" id="day-cancel">Отмена</button>' +
      '<div class="sp"></div>' +
      '<button class="del" id="day-clear">Очистить день</button>' +
    '</div>');

  $('add-game').onclick = function(){ daySync(); DAY.it.push({ k:'game', team:'МАХ', opp:'', home:1 }); dayForm(); };
  $('add-row').onclick  = function(){ daySync(); DAY.it.push({ k:'plan', t:'' }); dayForm(); };
  $('day-cancel').onclick = mClose;
  $('day-clear').onclick = function(){ DAY.it = []; daySave(); };
  $('day-save').onclick = function(){ daySync(); daySave(); };
  $('mbody').onclick = function(e){
    var b = e.target.closest ? e.target.closest('[data-del]') : null;
    if (!b) return;
    daySync();
    var idx = Number(b.getAttribute('data-del')), seen = -1;
    DAY.it = DAY.it.filter(function(x){
      if (x.k === 'game') return true;
      seen++; return seen !== idx;
    });
    dayForm();
  };
}

/* собирает значения полей обратно в DAY.it */
function daySync(){
  var box = $('mbody'), out = [];
  box.querySelectorAll('[data-g]').forEach(function(row){
    out.push({ k:'game',
      team: row.querySelector('[data-gf="team"]').value,
      opp:  row.querySelector('[data-gf="opp"]').value.trim(),
      home: Number(row.querySelector('[data-gf="home"]').value) });
  });
  box.querySelectorAll('[data-r]').forEach(function(row){
    out.push({ k: row.querySelector('[data-rf="k"]').value,
               t: row.querySelector('[data-rf="t"]').value });
  });
  DAY.it = out;
}

function daySave(){
  $('day-save').textContent = 'Сохраняю…';
  api({ a:'pdaysave', d: DAY.d, it: DAY.it }, function(res){
    if (!res || !res.ok){ $('day-save').textContent = 'Не вышло, ещё раз'; return; }
    mClose();
    SCH.cache = {};
    schLoad();
  });
}

/* ───────── редактор микроцикла ───────── */
function mcEdit(n){
  var c = null;
  (MC.list || []).forEach(function(x){ if (x.n === n) c = x; });
  if (!c) {
    var nums = (MC.list || []).map(function(x){ return Number(x.n) || 0; });
    c = { n: String(Math.max.apply(null, nums.concat([0])) + 1), dates:'', from:'', to:'',
          stage:'', tech:'', tac:'', psy:'', cog:'', theory:'', extra:'' };
  }
  var f = function(id, lab, val, ta){
    return '<div class="fld"><label>' + lab + '</label>' +
      (ta ? '<textarea id="f-' + id + '">' + esc(val || '') + '</textarea>'
          : '<input id="f-' + id + '" value="' + esc(val || '') + '">') + '</div>';
  };
  mOpen(
    '<h2>Микроцикл ' + esc(c.n) + '</h2>' +
    '<div class="ms">Даты в свободном виде, например «04.10–09.10». Начало и конец нужны, чтобы приложение понимало, какой цикл идёт сейчас.</div>' +
    '<div class="row2">' + f('dates','Даты', c.dates) + f('stage','Этап', c.stage) + '</div>' +
    '<div class="row2">' + f('from','Начало (2026-10-04)', c.from) + f('to','Конец (2026-10-09)', c.to) + '</div>' +
    f('tech','Техника · лёд', c.tech, 1) +
    f('tac','Тактика · лёд', c.tac, 1) +
    f('psy','Психология', c.psy, 1) +
    f('cog','Когнитивка', c.cog, 1) +
    f('theory','Теория', c.theory, 1) +
    f('extra','Дополнительно', c.extra, 1) +
    '<div class="mact">' +
      '<button class="btn" id="mc-save">Сохранить</button>' +
      '<button class="btn sec" id="mc-cancel">Отмена</button>' +
      '<div class="sp"></div>' +
      '<button class="del" id="mc-del">Удалить цикл</button>' +
    '</div>');

  $('mc-cancel').onclick = mClose;
  $('mc-del').onclick = function(){
    api({ a:'pmicrodel', n: c.n }, function(){ mClose(); MC.list = null; MC.sel = ''; mcLoad(true); });
  };
  $('mc-save').onclick = function(){
    var v = function(id){ return ($('f-' + id).value || '').trim(); };
    $('mc-save').textContent = 'Сохраняю…';
    api({ a:'pmicrosave', n: c.n, dates: v('dates'), from: v('from'), to: v('to'),
          stage: v('stage'), tech: v('tech'), tac: v('tac'), psy: v('psy'),
          cog: v('cog'), theory: v('theory'), extra: v('extra') }, function(res){
      if (!res || !res.ok){ $('mc-save').textContent = 'Не вышло, ещё раз'; return; }
      mClose(); MC.list = null; MC.sel = c.n; mcLoad(true);
    });
  };
}

/* ───────── игры ───────── */
var GM = { list: null, sit: [], gk: '' };
var LOADS = [['H','тяжёлая'], ['S','солидная'], ['O','нормальная'], ['B','плохая']];
var RESS  = ['В', 'ВО', 'ВБ', 'П', 'ПО', 'ПБ'];

function gmLoad(fresh){
  var sec = $('main').querySelector('[data-pg="games"]');
  if (GM.list && !fresh){ gmDraw(); return; }
  sec.innerHTML = '<div class="head"><h1>Игры</h1></div><div class="card"><div class="muted">Загружаю…</div></div>';
  api({ a:'games2' }, function(res){
    if (!res || !res.ok){
      sec.innerHTML = '<div class="head"><h1>Игры</h1></div>' +
        '<div class="card"><div class="muted">Не удалось загрузить.</div></div>';
      return;
    }
    GM.list = res.list || [];
    GM.sit  = res.sit  || [];
    gmDraw();
  });
}

function gmDraw(){
  var sec = $('main').querySelector('[data-pg="games"]');
  var list = GM.gk ? GM.list.filter(function(g){ return g.gk === GM.gk; }) : GM.list;

  /* сводка по отфильтрованному */
  var n = list.length, sh = 0, ga = 0, w = 0, l = 0, psy = 0, psyN = 0, gmp = 0, gmm = 0;
  list.forEach(function(g){
    sh += g.sh; ga += g.ga; gmp += g.gmp; gmm += g.gmm;
    if (/^В/.test(g.res)) w++; else if (/^П/.test(g.res)) l++;
    if (g.psy){ psy += g.psy; psyN++; }
  });
  var pct = sh ? Math.round((sh - ga) / sh * 1000) / 10 : null;
  var gmPct = (gmp + gmm) ? Math.round(gmp / (gmp + gmm) * 1000) / 10 : null;

  var names = {};
  GM.list.forEach(function(g){ if (g.gk) names[g.gk] = 1; });
  var opts = '<option value="">Все вратари</option>' + Object.keys(names).sort().map(function(x){
    return '<option' + (x === GM.gk ? ' selected' : '') + '>' + esc(x) + '</option>';
  }).join('');

  var rows = list.map(function(g){
    return '<tr data-gid="' + esc(g.id) + '">' +
      '<td>' + esc(g.d.slice(8) + '.' + g.d.slice(5,7)) + '</td>' +
      '<td class="gk">' + esc(g.gk) + '</td>' +
      '<td>' + esc(g.opp) + '<div class="muted" style="font-size:11.5px">' +
        (g.home ? 'дома' : 'выезд') + '</div></td>' +
      '<td>' + (g.res ? '<span class="wl ' + (/^В/.test(g.res) ? 'w' : 'l') + '">' + esc(g.res) + '</span>' : '') + '</td>' +
      '<td class="num">' + g.sh + '</td>' +
      '<td class="num">' + g.ga + '</td>' +
      '<td class="num"><b>' + (g.pct === null ? '—' : g.pct + '%') + '</b></td>' +
      '<td class="num">' + (g.gmp || g.gmm ? g.gmp + '/' + (g.gmp + g.gmm) : '—') + '</td>' +
      '<td>' + (g.load ? '<span class="ld ' + esc(g.load) + '">' + esc(g.load) + '</span>' : '') + '</td>' +
      '<td class="num">' + (g.psy || '—') + '</td>' +
      '<td class="num">' + ((g.gls || []).length || '') + '</td>' +
      '</tr>';
  }).join('');

  sec.innerHTML =
    '<div class="head"><h1>Игры</h1>' +
    '<div class="sub">отчёт, статистика, психология и голы</div>' +
    '<div class="sp"></div>' +
    '<select id="gm-gk" style="height:38px;border:1px solid var(--line);border-radius:10px;' +
      'background:var(--bg2);color:var(--tx);font-family:inherit;font-size:13.5px;padding:0 10px">' + opts + '</select>' +
    '<button class="btn sec sm" id="gm-new" style="margin-left:8px">+ Добавить игру</button></div>' +

    '<div class="kpi">' +
      '<div class="kp"><b>' + n + '</b><i>игр' + (GM.gk ? ' · ' + esc(GM.gk) : '') + '</i></div>' +
      '<div class="kp"><b>' + w + ' : ' + l + '</b><i>победы и поражения</i></div>' +
      '<div class="kp"><b>' + (pct === null ? '—' : pct + '%') + '</b><i>отражено, ' + (sh - ga) + ' из ' + sh + '</i></div>' +
      '<div class="kp"><b>' + (gmPct === null ? '—' : gmPct + '%') + '</b><i>голевые моменты</i></div>' +
      '<div class="kp"><b>' + (psyN ? Math.round(psy / psyN * 10) / 10 : '—') + '</b><i>психология, средний балл</i></div>' +
    '</div>' +

    '<div class="card">' + (n
      ? '<table class="tbl"><thead><tr>' +
          '<th>Дата</th><th>Вратарь</th><th>Соперник</th><th>Рез.</th>' +
          '<th class="num">БВ</th><th class="num">ПШ</th><th class="num">Отр.</th>' +
          '<th class="num">ГМ</th><th>Нагр.</th><th class="num">Псих.</th><th class="num">Голы</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>'
      : '<div class="soon"><b>Игр пока нет</b>Нажми «Добавить игру», чтобы занести первый матч.</div>') +
    '</div>';

  $('gm-gk').onchange = function(){ GM.gk = this.value; gmDraw(); };
  $('gm-new').onclick = function(){ gmEdit(''); };
  var tb = sec.querySelector('tbody');
  if (tb) tb.onclick = function(e){
    var tr = e.target.closest ? e.target.closest('[data-gid]') : null;
    if (tr) gmEdit(tr.getAttribute('data-gid'));
  };
}

/* ── карточка игры ── */
var GME = null;

function gmEdit(id){
  GME = null;
  (GM.list || []).forEach(function(g){ if (g.id === id) GME = JSON.parse(JSON.stringify(g)); });
  if (!GME) GME = { id:'', d: TODAY, gk:'', uid:'', opp:'', home:1, res:'',
                    sh:0, ga:0, gmp:0, gmm:0, load:'', psy:0, cm:'', gls:[] };
  gmForm();
}

function gmForm(){
  var g = GME;
  var gkOpts = ROSTER.map(function(r){
    var nm = r.name || '';
    return '<option value="' + esc(nm) + '" data-uid="' + esc(r.uid) + '"' +
           (nm === g.gk ? ' selected' : '') + '>' + esc(nm) + '</option>';
  }).join('');
  if (g.gk && ROSTER.every(function(r){ return r.name !== g.gk; }))
    gkOpts = '<option selected>' + esc(g.gk) + '</option>' + gkOpts;

  var glRows = (g.gls || []).map(function(x, i){
    return '<div class="gl" data-gl="' + i + '">' +
      '<select data-gf="s">' + GM.sit.map(function(sit){
        return '<option' + (sit === x.s ? ' selected' : '') + '>' + esc(sit) + '</option>';
      }).join('') + '</select>' +
      '<input data-gf="d" placeholder="деталь" value="' + esc(x.d || '') + '">' +
      '<select class="z" data-gf="z">' +
        '<option value=""></option>' +
        [1,2,3,4,5,6,7,8,9].map(function(z){
          return '<option value="' + z + '"' + (Number(x.z) === z ? ' selected' : '') + '>' + z + '</option>';
        }).join('') + '</select>' +
      '<button class="x" data-glx="' + i + '">×</button></div>';
  }).join('');

  mOpen(
    '<h2>' + (g.id ? 'Игра' : 'Новая игра') + '</h2>' +
    '<div class="ms">Отражённые броски и процент считаются сами.</div>' +

    '<div class="row2">' +
      '<div class="fld"><label>Дата</label><input id="f-d" type="date" value="' + esc(g.d) + '"></div>' +
      '<div class="fld"><label>Вратарь</label><select id="f-gk">' + gkOpts + '</select></div>' +
    '</div>' +
    '<div class="row2">' +
      '<div class="fld"><label>Соперник</label><input id="f-opp" value="' + esc(g.opp) + '"></div>' +
      '<div class="fld"><label>Где</label><select id="f-home">' +
        '<option value="1"' + (g.home ? ' selected' : '') + '>Дома</option>' +
        '<option value="0"' + (g.home ? '' : ' selected') + '>Выезд</option></select></div>' +
    '</div>' +
    '<div class="row2">' +
      '<div class="fld"><label>Результат</label><select id="f-res">' +
        '<option value=""></option>' + RESS.map(function(r){
          return '<option' + (r === g.res ? ' selected' : '') + '>' + r + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="fld"><label>Нагрузка и качество</label><select id="f-load">' +
        '<option value=""></option>' + LOADS.map(function(x){
          return '<option value="' + x[0] + '"' + (x[0] === g.load ? ' selected' : '') + '>' +
                 x[0] + ' — ' + x[1] + '</option>'; }).join('') +
      '</select></div>' +
    '</div>' +
    '<div class="row2">' +
      '<div class="fld"><label>Броски в створ</label><input id="f-sh" type="number" min="0" value="' + g.sh + '"></div>' +
      '<div class="fld"><label>Пропущено</label><input id="f-ga" type="number" min="0" value="' + g.ga + '"></div>' +
    '</div>' +
    '<div class="row2">' +
      '<div class="fld"><label>Голевых выручил</label><input id="f-gmp" type="number" min="0" value="' + g.gmp + '"></div>' +
      '<div class="fld"><label>Голевых пропустил</label><input id="f-gmm" type="number" min="0" value="' + g.gmm + '"></div>' +
    '</div>' +
    '<div class="fld"><label>Психология, балл 1–10 · 9–10 ключевая роль · 7–8 уверенно · 5–6 качели · 3–4 срыв</label>' +
      '<input id="f-psy" type="number" min="0" max="10" value="' + (g.psy || '') + '"></div>' +
    '<div class="fld"><label>Комментарий</label><textarea id="f-cm">' + esc(g.cm) + '</textarea></div>' +

    '<div class="fld"><label>Голы — ситуация, деталь, зона ворот</label>' +
      '<div class="dets" style="margin:-2px 0 8px">зоны: 1 2 3 — верх, 4 5 6 — середина, 7 8 9 — низ; слева направо со стороны броска</div>' + glRows +
      '<button class="addbtn" id="gl-add">+ добавить гол</button></div>' +

    '<div class="mact">' +
      '<button class="btn" id="gm-save">Сохранить</button>' +
      '<button class="btn sec" id="gm-cancel">Отмена</button>' +
      '<div class="sp"></div>' +
      (g.id ? '<button class="del" id="gm-del">Удалить игру</button>' : '') +
    '</div>');

  $('gm-cancel').onclick = mClose;
  $('gl-add').onclick = function(){ gmSync(); GME.gls.push({ s: GM.sit[0], d:'', z:'' }); gmForm(); };
  $('mbody').onclick = function(e){
    var b = e.target.closest ? e.target.closest('[data-glx]') : null;
    if (!b) return;
    gmSync();
    GME.gls.splice(Number(b.getAttribute('data-glx')), 1);
    gmForm();
  };
  if ($('gm-del')) $('gm-del').onclick = function(){
    if (!confirm('Удалить эту игру?')) return;
    api({ a:'game2del', id: g.id }, function(){ mClose(); GM.list = null; gmLoad(true); });
  };
  $('gm-save').onclick = function(){
    gmSync();
    if (!GME.gk){ alert('Выбери вратаря.'); return; }
    $('gm-save').textContent = 'Сохраняю…';
    api({ a:'game2save', id: GME.id, d: GME.d, gk: GME.gk, uid: GME.uid, opp: GME.opp,
          home: GME.home, res: GME.res, sh: GME.sh, ga: GME.ga, gmp: GME.gmp, gmm: GME.gmm,
          load: GME.load, psy: GME.psy, cm: GME.cm, gls: GME.gls }, function(res){
      if (!res || !res.ok){ $('gm-save').textContent = 'Не вышло, ещё раз'; return; }
      mClose(); GM.list = null; gmLoad(true);
    });
  };
}

function gmSync(){
  var v = function(id){ var el = $('f-' + id); return el ? el.value : ''; };
  var sel = $('f-gk'), opt = sel ? sel.options[sel.selectedIndex] : null;
  GME.d    = v('d');
  GME.gk   = sel ? sel.value : '';
  GME.uid  = opt ? (opt.getAttribute('data-uid') || '') : '';
  GME.opp  = v('opp').trim();
  GME.home = Number(v('home'));
  GME.res  = v('res');
  GME.load = v('load');
  GME.sh   = Number(v('sh'))  || 0;
  GME.ga   = Number(v('ga'))  || 0;
  GME.gmp  = Number(v('gmp')) || 0;
  GME.gmm  = Number(v('gmm')) || 0;
  GME.psy  = Number(v('psy')) || 0;
  GME.cm   = v('cm');
  var gls = [];
  $('mbody').querySelectorAll('[data-gl]').forEach(function(row){
    gls.push({ s: row.querySelector('[data-gf="s"]').value,
               d: row.querySelector('[data-gf="d"]').value.trim(),
               z: Number(row.querySelector('[data-gf="z"]').value) || '' });
  });
  GME.gls = gls;
}

/* ───────── аналитика голов ───────── */
var AN = { gk: '', from: '', to: '' };
var ZNAMES = ['верх левый','верх центр','верх правый',
              'средн левый','средн центр','средн правый',
              'низ левый','низ центр','низ правый'];

function anLoad(){
  if (!GM.list){
    var sec = $('main').querySelector('[data-pg="goals"]');
    sec.innerHTML = '<div class="head"><h1>Аналитика голов</h1></div>' +
                    '<div class="card"><div class="muted">Загружаю…</div></div>';
    api({ a:'games2' }, function(res){
      if (!res || !res.ok){
        sec.innerHTML = '<div class="head"><h1>Аналитика голов</h1></div>' +
          '<div class="card"><div class="muted">Не удалось загрузить.</div></div>';
        return;
      }
      GM.list = res.list || []; GM.sit = res.sit || [];
      anDraw();
    });
    return;
  }
  anDraw();
}

function anDraw(){
  var sec = $('main').querySelector('[data-pg="goals"]');
  var list = (GM.list || []).filter(function(g){
    if (AN.gk && g.gk !== AN.gk) return false;
    if (AN.from && g.d < AN.from) return false;
    if (AN.to   && g.d > AN.to)   return false;
    return true;
  });

  var zones = [0,0,0,0,0,0,0,0,0], sits = {}, dets = {}, total = 0, shots = 0;
  list.forEach(function(g){
    shots += g.sh;
    (g.gls || []).forEach(function(x){
      total++;
      var z = Number(x.z) || 0;
      if (z >= 1 && z <= 9) zones[z - 1]++;
      var sname = x.s || 'Другое';
      sits[sname] = (sits[sname] || 0) + 1;
      if (x.d){
        if (!dets[sname]) dets[sname] = {};
        dets[sname][x.d] = (dets[sname][x.d] || 0) + 1;
      }
    });
  });

  var zmax = Math.max.apply(null, zones) || 1;
  var net = zones.map(function(n, i){
    var k = n / zmax;
    var style = n ? ' style="background:rgba(214,17,46,' + (0.18 + k * 0.72).toFixed(2) + ')"' : '';
    return '<div class="z' + (n && k > 0.55 ? ' hot' : '') + '"' + style + '>' +
           '<b>' + (n || '') + '</b><i>' + ZNAMES[i] + '</i></div>';
  }).join('');

  var arr = Object.keys(sits).map(function(k){ return { s:k, n:sits[k] }; })
                  .sort(function(a,b){ return b.n - a.n; });
  var smax = arr.length ? arr[0].n : 1;
  var bars = arr.map(function(x){
    var d = dets[x.s] ? Object.keys(dets[x.s]).sort(function(a,b){ return dets[x.s][b] - dets[x.s][a]; })
              .map(function(k){ return esc(k) + ' ' + dets[x.s][k]; }).join(' · ') : '';
    return '<div class="bar"><div class="nm">' + esc(x.s) + '</div>' +
           '<div class="ln"><u style="width:' + Math.round(x.n / smax * 100) + '%"></u></div>' +
           '<div class="vl"><b>' + x.n + '</b> · ' + (total ? Math.round(x.n / total * 1000) / 10 : 0) + '%</div></div>' +
           (d ? '<div class="dets" style="margin:-4px 0 2px 160px">' + d + '</div>' : '');
  }).join('');

  var names = {};
  (GM.list || []).forEach(function(g){ if (g.gk) names[g.gk] = 1; });
  var opts = '<option value="">Все вратари</option>' + Object.keys(names).sort().map(function(x){
    return '<option' + (x === AN.gk ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('');

  var byGk = {};
  list.forEach(function(g){
    var k = g.gk || '—';
    if (!byGk[k]) byGk[k] = { n:0, sh:0, ga:0 };
    byGk[k].n++; byGk[k].sh += g.sh; byGk[k].ga += g.ga;
  });
  var gkRows = Object.keys(byGk).sort().map(function(k){
    var b = byGk[k], pct = b.sh ? Math.round((b.sh - b.ga) / b.sh * 1000) / 10 : null;
    return '<tr><td class="gk">' + esc(k) + '</td><td class="num">' + b.n + '</td>' +
           '<td class="num">' + b.sh + '</td><td class="num">' + b.ga + '</td>' +
           '<td class="num"><b>' + (pct === null ? '—' : pct + '%') + '</b></td></tr>';
  }).join('');

  sec.innerHTML =
    '<div class="head"><h1>Аналитика голов</h1>' +
    '<div class="sub">собирается из голов, записанных в карточках игр</div>' +
    '<div class="sp"></div>' +
    '<select id="an-gk" style="height:38px;border:1px solid var(--line);border-radius:10px;' +
      'background:var(--bg2);color:var(--tx);font-family:inherit;font-size:13.5px;padding:0 10px">' + opts + '</select>' +
    '</div>' +

    '<div class="kpi">' +
      '<div class="kp"><b>' + list.length + '</b><i>игр в выборке</i></div>' +
      '<div class="kp"><b>' + total + '</b><i>голов записано</i></div>' +
      '<div class="kp"><b>' + (shots ? Math.round((shots - total) / shots * 1000) / 10 + '%' : '—') +
        '</b><i>отражено от ' + shots + ' бросков</i></div>' +
      '<div class="kp"><b>' + (list.length ? Math.round(total / list.length * 10) / 10 : '—') +
        '</b><i>голов за игру</i></div>' +
    '</div>' +

    '<div class="anwrap">' +
      '<div class="card"><h2>Куда забивают</h2>' +
        '<div class="goal">' + net + '</div>' +
        '<div class="ice">вид со стороны броска · чем темнее, тем чаще</div></div>' +
      '<div class="card"><h2>Ситуации</h2>' +
        (arr.length ? '<div class="bars">' + bars + '</div>'
                    : '<div class="muted">Голы пока не записаны. Заноси их в карточке игры.</div>') +
      '</div>' +
    '</div>' +

    (gkRows ? '<div class="card"><h2>По вратарям</h2><table class="tbl"><thead><tr>' +
      '<th>Вратарь</th><th class="num">Игр</th><th class="num">БВ</th><th class="num">ПШ</th>' +
      '<th class="num">Отражено</th></tr></thead><tbody>' + gkRows + '</tbody></table></div>' : '');

  $('an-gk').onchange = function(){ AN.gk = this.value; anDraw(); };
}

/* ───────── запуск ───────── */
function start(){
  showGate(false);
  $('me-name').textContent = ME.name || 'Тренер';
  go('sched');
}

function boot(){
  $('g-in').onclick = gateIn;
  $('g-code').onkeydown = function(e){ if (e.key === 'Enter') gateIn(); };
  $('me-out').onclick = gateOut;
  $('thm').onclick = function(){ applyTheme(document.body.className !== 'dk'); };
  initTheme();
  $('w-prev').onclick = function(){ SCH.mon = shift(SCH.mon, -7); schLoad(); };
  $('w-next').onclick = function(){ SCH.mon = shift(SCH.mon,  7); schLoad(); };
  $('w-now').onclick  = function(){ SCH.mon = monday(TODAY);      schLoad(); };
  $('sch-copy').onclick = function(){
    if (!confirm('Скопировать эту неделю на следующую? Записи следующей недели будут заменены.')) return;
    api({ a:'pweekcopy', from: SCH.mon, to: shift(SCH.mon, 7) }, function(res){
      if (!res || !res.ok){ alert('Не получилось скопировать.'); return; }
      SCH.cache = {}; SCH.mon = shift(SCH.mon, 7); schLoad();
    });
  };
  var nav = $('nav');
  nav.onclick = function(e){
    var b = e.target.closest ? e.target.closest('button[data-p]') : null;
    if (b) go(b.getAttribute('data-p'));
  };

  if (!KEY){ showGate(true); $('g-code').focus(); return; }
  /* ключ есть — проверяем, что он тренерский */
  /* roster отдаётся только тренеру — заодно проверка доступа */
  api({ a:'roster' }, function(res){
    if (!res || !res.ok){
      showGate(true);
      if (res && res.err === 'forbidden') $('g-err').textContent = 'Этот вход не тренерский.';
      return;
    }
    ME.coach = true;
    ROSTER = res.list || [];
    start();
  });
}
boot();
</script>
